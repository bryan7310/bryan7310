name: 策略回測比較

on:
  workflow_dispatch:
    inputs:
      days:
        description: "回測天數（交易日，約 250 天 = 1 年）"
        default: "2500"

jobs:
  backtest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 回測
        run: |
          python backtest.py --days "${{ inputs.days }}" | tee result.txt
          { echo '## 回測結果'; echo '```'; cat result.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
