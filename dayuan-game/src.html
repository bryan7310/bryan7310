<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>大元國小大冒險</title>
<style>
:root{--bg:#0f1a12;--panel:rgba(14,26,18,.80);--ink:#f4f7f1;--muted:#b9c7b8;--accent:#2fa84f;--orange:#f08a24;--warn:#e8542f;--gold:#f2c230;--blue:#2f6fd0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1a12}}
:root[data-theme="dark"]{--bg:#0f1a12}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#game{display:block;width:100vw;height:100vh}
.panel{background:var(--panel);border:1px solid rgba(255,255,255,.12);border-radius:12px;backdrop-filter:blur(4px)}
#hud{position:fixed;left:12px;top:12px;width:min(270px,calc(100vw - 210px));padding:10px 12px;font-size:14px;pointer-events:none}
#hpbar{height:14px;border-radius:7px;background:#3a2a2a;overflow:hidden;margin:4px 0 6px}
#hpfill{height:100%;width:100%;background:linear-gradient(90deg,#e8542f,#f2c230 60%,#2fa84f);transition:width .15s}
#hud .row{display:flex;justify-content:space-between;gap:8px}
#buffs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
#buffs span{font-size:12px;padding:1px 7px;border-radius:9px;background:rgba(242,194,48,.22);border:1px solid rgba(242,194,48,.5)}
#quests{margin:8px 0 0;padding:0;list-style:none;font-size:13px;line-height:1.55}
#quests li{color:var(--muted)}
#quests li.cur{color:#fff;font-weight:700}
#quests li.done{color:#7fd08f;text-decoration:line-through}
#mini{position:fixed;right:12px;top:12px;width:180px;height:146px;border-radius:12px;border:2px solid rgba(255,255,255,.35);background:#222;pointer-events:none}
#bossbar{position:fixed;left:50%;top:14px;transform:translateX(-50%);width:min(420px,50vw);padding:6px 10px;display:none;text-align:center;font-weight:700;font-size:14px}
#bossbar .bar{height:10px;border-radius:5px;background:#3a2a2a;overflow:hidden;margin-top:4px}
#bossfill{height:100%;width:100%;background:#d4352a}
#prompt{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);padding:8px 16px;font-size:16px;display:none;pointer-events:none;white-space:nowrap}
#banner{position:fixed;left:50%;top:22%;transform:translateX(-50%);font-size:clamp(20px,4.5vw,36px);font-weight:900;color:#fff;text-shadow:0 3px 0 #0006,0 0 18px #000a;opacity:0;transition:opacity .4s;pointer-events:none;text-align:center;width:92vw}
#dlg{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(720px,calc(100vw - 24px));padding:14px 18px 12px;display:none;cursor:pointer}
#dlg .who{display:inline-block;font-weight:900;color:#1b1b1b;background:var(--gold);border-radius:8px;padding:2px 10px;margin-bottom:6px}
#dlg .txt{font-size:18px;line-height:1.55;min-height:2.6em}
#dlg .next{text-align:right;font-size:12px;color:var(--muted)}
#hurt{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 30px rgba(220,30,30,.0);transition:box-shadow .25s}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,16,10,.72);padding:16px}
.card{max-width:560px;width:100%;padding:22px 24px;text-align:center;max-height:94vh;overflow:auto}
.card h1{margin:6px 0 4px;font-size:clamp(26px,6vw,38px);letter-spacing:2px}
.card h2{margin:6px 0;font-size:26px}
.card p{line-height:1.6;color:#dfe8de;margin:8px 0}
.card .keys{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;text-align:left;margin:12px auto;max-width:360px;font-size:14px}
.card .keys b{color:var(--gold)}
.card img{width:74px;height:auto}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 26px;font-size:18px;font-weight:800;background:var(--accent);color:#fff;cursor:pointer;margin-top:8px;box-shadow:0 4px 0 #1d6f33}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1d6f33}
.pop{position:fixed;pointer-events:none;font-weight:900;font-size:18px;color:var(--gold);text-shadow:0 2px 0 #000a;transform:translate(-50%,-50%)}
#touch{display:none}
body.touch #touch{display:block}
#joy{position:fixed;left:22px;bottom:26px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3)}
#knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.55)}
#tbtns{position:fixed;right:18px;bottom:26px;display:flex;gap:14px;align-items:flex-end}
#tbtns button{width:78px;height:78px;border-radius:50%;border:2px solid rgba(255,255,255,.5);font-size:17px;font-weight:900;color:#fff}
#bThrow{background:rgba(232,84,47,.75);width:92px!important;height:92px!important}
#bTalk{background:rgba(47,111,208,.7)}
#bTalk.hot{background:rgba(242,194,48,.95);color:#222}
body.touch #prompt{bottom:170px}
@media (max-width:560px){#mini{width:130px;height:106px}#hud{font-size:12px;width:calc(100vw - 166px)}#quests{font-size:12px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hurt"></div>
<div id="hud" class="panel">
  <div class="row"><b>體力</b><span id="hptxt">100/100</span></div>
  <div id="hpbar"><div id="hpfill"></div></div>
  <div class="row"><span>分數 <b id="score">0</b></span><span>同學 <b id="fcount">0</b></span></div>
  <div id="buffs"></div>
  <ul id="quests"></ul>
</div>
<canvas id="mini" width="360" height="292"></canvas>
<div id="bossbar" class="panel">考卷大魔王<div class="bar"><div id="bossfill"></div></div></div>
<div id="prompt" class="panel"></div>
<div id="banner"></div>
<div id="dlg" class="panel"><div class="who"></div><div class="txt"></div><div class="next">按 E / 空白鍵 / 點一下 繼續 ▶</div></div>
<div id="touch">
  <div id="joy"><div id="knob"></div></div>
  <div id="tbtns"><button id="bTalk">對話</button><button id="bThrow">丟球</button></div>
</div>

<div id="startOv" class="overlay">
  <div class="card panel">
    <img id="startLogo" alt="大元國小校徽">
    <h1>大元國小大冒險</h1>
    <p>「考卷大魔王」派出作業怪、蚊子怪和搗蛋鬼佔領了校園！<br>先到<b>中庭</b>找校長報到，找同學組隊，一起保衛大元國小！</p>
    <div class="keys">
      <b>WASD / 方向鍵</b><span>走路（按住 Shift 跑步）</span>
      <b>滑鼠拖曳</b><span>轉動視角</span>
      <b>點擊 / 空白鍵</b><span>丟躲避球</span>
      <b>E</b><span>和校長、老師、同學說話</span>
      <b>手機</b><span>左下搖桿走路，拖曳畫面轉視角</span>
    </div>
    <button class="btn" id="startBtn">開始冒險！</button>
  </div>
</div>
<div id="deadOv" class="overlay" style="display:none">
  <div class="card panel">
    <h2>哎呀，被打倒了！</h2>
    <p>護理阿姨幫你擦好藥，送你回到中庭。<br>別灰心，再接再厲！</p>
    <button class="btn" id="reviveBtn">回到中庭</button>
  </div>
</div>
<div id="winOv" class="overlay" style="display:none">
  <div class="card panel">
    <img id="winLogo" alt="大元國小校徽">
    <h2>🏆 校園英雄獎 🏆</h2>
    <p id="winTxt"></p>
    <button class="btn" id="againBtn">再玩一次</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
const LOGO_SRC='__LOGO__';
const logoImg=new Image();
document.getElementById('startLogo').src=LOGO_SRC;
document.getElementById('winLogo').src=LOGO_SRC;

// ================= helpers =================
const S=0.35, CX=303, CY=246, PAD=250, D2R=Math.PI/180;
const wx=px=>(px-CX)*S, wz=py=>(py-CY)*S;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return [c,c.getContext('2d')];}
function tex(c,rep){const t=new THREE.CanvasTexture(c);if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;}t.anisotropy=4;return t;}
function lam(color,extra){const o=Object.assign({color},extra||{});if(o.flatShading)return new THREE.MeshPhongMaterial(Object.assign(o,{shininess:0,specular:0x000000}));return new THREE.MeshLambertMaterial(o);}
function box(w,h,d,m){const me=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);me.castShadow=true;return me;}
function sph(r,m,ws,hs){const me=new THREE.Mesh(new THREE.SphereGeometry(r,ws||12,hs||10),m);me.castShadow=true;return me;}
function pip(x,y,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c;}
function distSeg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(px-ax-t*dx,py-ay-t*dy);}
function distPoly(x,y,poly,closed=true){let m=1e9;const n=poly.length;for(let i=0;i<(closed?n:n-1);i++){const a=poly[i],b=poly[(i+1)%n];m=Math.min(m,distSeg(x,y,a[0],a[1],b[0],b[1]));}return m;}

// ================= map data (pixels of the 606x492 satellite image) =================
const BOUNDARY=[[0,135],[130,5],[310,5],[530,30],[560,95],[495,392],[455,490],[195,490],[188,325],[15,210]];
const BOUNDW=BOUNDARY.map(p=>[wx(p[0]),wz(p[1])]);
const ROADS=[
  {pts:[[675,-250],[495,742]],w:70,main:true},
  {pts:[[-250,-30],[856,-12]],w:36},
  {pts:[[-250,85],[165,335],[172,742]],w:30},
];
const BUILDINGS=[
  {id:'admin',c:[225,68],l:150,w:48,a:25,floors:4,sign:true,towers:[-1,1],stair:[1,1],stone:true},
  {id:'west',c:[95,78],l:150,w:35,a:-43.7,floors:4,towers:[1]},
  {id:'kitchen',c:[358,85],l:62,w:56,a:20,floors:2,label:'午餐廚房'},
  {id:'main',c:[140,208],l:227,w:42,a:28,floors:4,towers:[-1,0,1],stair:[1,1]},
  {id:'red',c:[262,215],l:52,w:44,a:26,floors:2,redRoof:true},
  {id:'gym',c:[256,422],l:95,w:100,a:10,gym:true},
];
const TRACK={c:[422,252],a:-69.4,half:40,r:88,inner:70};
const TENNIS={c:[450,78],a:18};
const FLAG=[311,170];
const PLANTER={c:[195,150],l:72,w:16,a:26};
const STAGE={c:[290,166],l:16,w:30,a:26};
const POND={c:[312,132],rx:14,ry:10};
const STRIP=[[549,102],[490,372]];
function trackLocalToPx(lx,ly){const a=TRACK.a*D2R,c=Math.cos(a),s=Math.sin(a);return [TRACK.c[0]+lx*c-ly*s,TRACK.c[1]+lx*s+ly*c];}
function pxToTrackLocal(x,y){const a=TRACK.a*D2R,c=Math.cos(a),s=Math.sin(a),dx=x-TRACK.c[0],dy=y-TRACK.c[1];return [dx*c+dy*s,-dx*s+dy*c];}
function stadiumDist(x,y){const [lx,ly]=pxToTrackLocal(x,y);const cx=clamp(lx,-TRACK.half,TRACK.half);return Math.hypot(lx-cx,ly);}
function obbCornersPx(b,pad=0){const a=b.a*D2R,u=[Math.cos(a),Math.sin(a)],v=[-Math.sin(a),Math.cos(a)],hl=b.l/2+pad,hw=b.w/2+pad;
  return [[1,1],[1,-1],[-1,-1],[-1,1]].map(([i,j])=>[b.c[0]+u[0]*hl*i+v[0]*hw*j,b.c[1]+u[1]*hl*i+v[1]*hw*j]);}
function inBuildingPx(x,y,pad){for(const b of BUILDINGS){if(pip(x,y,obbCornersPx(b,pad)))return true;}return false;}

// ================= renderer / scene =================
const canvas=document.getElementById('game');
const renderer=new THREE.WebGLRenderer({antialias:true,canvas});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xa9d4f2);
scene.fog=new THREE.Fog(0xa9d4f2,80,240);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,700);
scene.add(new THREE.HemisphereLight(0xe2f1ff,0x6b7a4a,0.7));
const sun=new THREE.DirectionalLight(0xfff2d8,0.82);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-45,right:45,top:45,bottom:-45,near:1,far:220});
sun.shadow.bias=-0.0008;
scene.add(sun);scene.add(sun.target);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

// ================= ground texture =================
const PW=606+PAD*2, PH=492+PAD*2;
function buildGround(){
  const K=2048/PW;const [c,g]=cv(2048,Math.round(PH*K));
  g.setTransform(K,0,0,K,PAD*K,PAD*K);
  g.fillStyle='#8e8c84';g.fillRect(-PAD,-PAD,PW,PH);
  for(let i=0;i<5000;i++){const v=120+Math.random()*40|0;g.fillStyle=`rgba(${v},${v-4},${v-12},.5)`;g.fillRect(rand(-PAD,606+PAD),rand(-PAD,492+PAD),rand(1,5),rand(1,5));}
  const line=(pts,w,col,dash)=>{g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(const p of pts.slice(1))g.lineTo(p[0],p[1]);g.lineWidth=w;g.strokeStyle=col;g.lineJoin='round';g.lineCap='round';g.setLineDash(dash||[]);g.stroke();g.setLineDash([]);};
  for(const r of ROADS)line(r.pts,r.w+12,'#bdb7aa');
  for(const r of ROADS)line(r.pts,r.w,'#55575b');
  for(const r of ROADS){
    if(r.main){
      const [a,b]=r.pts,dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L;
      for(const o of[-1.2,1.2])line([[a[0]+nx*o,a[1]+ny*o],[b[0]+nx*o,b[1]+ny*o]],0.8,'#e8c33a');
      for(const o of[-18,18])line([[a[0]+nx*o,a[1]+ny*o],[b[0]+nx*o,b[1]+ny*o]],0.8,'#eee',[8,8]);
    } else line(r.pts,0.8,'#eee',[7,7]);
  }
  const poly=(pts)=>{g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(const p of pts.slice(1))g.lineTo(p[0],p[1]);g.closePath();};
  // school ground
  poly(BOUNDARY);g.fillStyle='#6f8f47';g.fill();
  g.save();poly(BOUNDARY);g.clip();
  for(let i=0;i<14000;i++){const gr=110+Math.random()*50|0;g.fillStyle=`rgba(${gr-50},${gr},${gr-70},.45)`;g.fillRect(rand(0,606),rand(0,492),rand(1,3),rand(1,3));}
  g.fillStyle='#a9a293';
  for(const b of BUILDINGS){poly(obbCornersPx(b,b.gym?18:13));g.fill();}
  for(const p of[[[230,165],[300,200],[335,220]],[[300,200],[292,300],[262,368]],[[300,200],[338,152],[400,132],[440,122]],[[150,250],[250,300],[300,330],[330,372]]])line(p,13,'#a9a293');
  // plaza
  g.save();g.translate(220,158);g.rotate(26*D2R);g.fillStyle='#a8927c';g.fillRect(-80,-30,160,60);
  g.strokeStyle='rgba(120,90,70,.25)';g.lineWidth=.5;for(let x=-80;x<80;x+=6){g.beginPath();g.moveTo(x,-30);g.lineTo(x,30);g.stroke();}g.restore();
  g.beginPath();g.ellipse(POND.c[0],POND.c[1],POND.rx+3,POND.ry+3,0.3,0,Math.PI*2);g.fillStyle='#8d8577';g.fill();
  g.beginPath();g.ellipse(POND.c[0],POND.c[1],POND.rx,POND.ry,0.3,0,Math.PI*2);g.fillStyle='#3fb7c9';g.fill();
  g.fillStyle='#4f9a3c';for(const [x,y] of [[306,128],[316,136],[320,127]]){g.beginPath();g.arc(x,y,2.2,0,7);g.fill();}
  line(STRIP,16,'#b44a3e');for(const o of[-5,0,5]){const d=[STRIP[1][0]-STRIP[0][0],STRIP[1][1]-STRIP[0][1]],L=Math.hypot(d[0],d[1]),n=[-d[1]/L*o,d[0]/L*o];line([[STRIP[0][0]+n[0],STRIP[0][1]+n[1]],[STRIP[1][0]+n[0],STRIP[1][1]+n[1]]],.45,'rgba(255,255,255,.85)');}
  // track
  const stad=(a,r)=>{g.beginPath();g.moveTo(-a,-r);g.lineTo(a,-r);g.arc(a,0,r,-Math.PI/2,Math.PI/2);g.lineTo(-a,r);g.arc(-a,0,r,Math.PI/2,Math.PI*1.5);g.closePath();};
  g.save();g.translate(TRACK.c[0],TRACK.c[1]);g.rotate(TRACK.a*D2R);
  stad(40,96);g.fillStyle='#cfc8b6';g.fill();
  stad(40,88);g.fillStyle='#b44a3e';g.fill();
  g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=.45;for(let i=1;i<6;i++){stad(40,70+i*3);g.stroke();}
  stad(40,70);g.fillStyle='#8c9c52';g.fill();
  g.save();stad(40,70);g.clip();for(let x=-110;x<110;x+=24){g.fillStyle='rgba(255,255,255,.06)';g.fillRect(x,-80,12,160);}g.restore();
  g.fillStyle='#fff';g.fillRect(-12,70,1.4,18);g.fillRect(-12,-88,1.4,18);
  g.fillStyle='#b44a3e';g.fillRect(-58,-55,120,110);
  g.fillStyle='#3e9a58';g.fillRect(-5,-45,60,90);
  g.strokeStyle='#fff';g.lineWidth=.8;g.strokeRect(-2,-42,54,84);
  g.beginPath();g.moveTo(-2,0);g.lineTo(52,0);g.stroke();g.beginPath();g.arc(25,0,9,0,Math.PI*2);g.stroke();
  g.beginPath();g.arc(25,-42,14,0,Math.PI);g.stroke();g.beginPath();g.arc(25,42,14,Math.PI,Math.PI*2);g.stroke();
  g.fillStyle='#3a6fc9';g.fillRect(-48,-30,36,60);
  g.strokeRect(-46,-28,32,56);g.beginPath();g.moveTo(-46,0);g.lineTo(-14,0);g.stroke();
  g.strokeRect(-36,-28,12,12);g.strokeRect(-36,16,12,12);g.beginPath();g.arc(-30,0,5,0,Math.PI*2);g.stroke();
  g.restore();
  // tennis
  g.save();g.translate(TENNIS.c[0],TENNIS.c[1]);g.rotate(TENNIS.a*D2R);
  g.fillStyle='#2f8a55';g.fillRect(-48,-33,96,66);g.fillStyle='#3a9a5e';g.fillRect(-42,-27,84,54);
  g.strokeStyle='#fff';g.lineWidth=.8;g.strokeRect(-40,-25,80,50);g.beginPath();g.moveTo(0,-25);g.lineTo(0,25);g.stroke();
  g.beginPath();g.arc(0,0,7,0,7);g.stroke();g.strokeRect(-40,-8,15,16);g.strokeRect(25,-8,15,16);
  g.beginPath();g.arc(-25,0,8,-Math.PI/2,Math.PI/2);g.stroke();g.beginPath();g.arc(25,0,8,Math.PI/2,Math.PI*1.5);g.stroke();
  g.strokeStyle='#e8c33a';g.beginPath();g.arc(-40,0,22,-Math.PI/2,Math.PI/2);g.stroke();g.beginPath();g.arc(40,0,22,Math.PI/2,Math.PI*1.5);g.stroke();
  g.restore();
  g.restore();
  return {c,K};
}
const ground=buildGround();
{
  const t=tex(ground.c);t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  const m=new THREE.Mesh(new THREE.PlaneGeometry(PW*S,PH*S),new THREE.MeshLambertMaterial({map:t}));
  m.rotation.x=-Math.PI/2;m.receiveShadow=true;scene.add(m);
  const o=new THREE.Mesh(new THREE.PlaneGeometry(2400,2400),lam(0x8e8c84));o.rotation.x=-Math.PI/2;o.position.y=-0.05;scene.add(o);
}

// ================= colliders =================
const OBBS=[], CIRCLES=[];
function addOBB(cx,cz,hx,hz,a,h){OBBS.push({cx,cz,hx,hz,c:Math.cos(a),s:Math.sin(a),h:h||20});}
function resolve(x,z,r,noTrees){
  for(const o of OBBS){const dx=x-o.cx,dz=z-o.cz;let lx=dx*o.c+dz*o.s,lz=-dx*o.s+dz*o.c;
    const px=o.hx+r-Math.abs(lx),pz=o.hz+r-Math.abs(lz);
    if(px>0&&pz>0){if(px<pz)lx=Math.sign(lx||1)*(o.hx+r);else lz=Math.sign(lz||1)*(o.hz+r);
      x=o.cx+lx*o.c-lz*o.s;z=o.cz+lx*o.s+lz*o.c;}}
  if(!noTrees)for(const ci of CIRCLES){const dx=x-ci.x,dz=z-ci.z,d=Math.hypot(dx,dz),m=ci.r+r;if(d<m&&d>1e-4){x=ci.x+dx/d*m;z=ci.z+dz/d*m;}}
  return {x,z};
}
function inOBB(x,z,pad=0){for(const o of OBBS){const dx=x-o.cx,dz=z-o.cz,lx=dx*o.c+dz*o.s,lz=-dx*o.s+dz*o.c;if(Math.abs(lx)<o.hx+pad&&Math.abs(lz)<o.hz+pad)return true;}return false;}
function walkable(x,z){return pip(x,z,BOUNDW)&&distPoly(x,z,BOUNDW)>0.5;}
function moveEntity(p,dx,dz,r,noTrees){
  let q=resolve(p.x+dx,p.z+dz,r,noTrees);if(walkable(q.x,q.z)){p.x=q.x;p.z=q.z;return;}
  q=resolve(p.x+dx,p.z,r,noTrees);if(walkable(q.x,q.z)){p.x=q.x;p.z=q.z;return;}
  q=resolve(p.x,p.z+dz,r,noTrees);if(walkable(q.x,q.z)){p.x=q.x;p.z=q.z;}
}

function joyMove(e){const r=$('joy').getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const l=Math.hypot(dx,dy),m=50;if(l>m){dx=dx/l*m;dy=dy/l*m;}

let nearNPC=null,spawnT=3,clock=new THREE.Clock(),T=0;
function nearestEnemy(x,z,maxD,cone){let best=null,bd=maxD;for(const e of enemies){if(e.dead)continue;const dx=e.x-x,dz=e.z-z,d=Math.hypot(dx,dz);if(d>=bd)continue;
  if(cone){const a=Math.atan2(dx,dz),diff=Math.abs(((a-cone+Math.PI*3)%(Math.PI*2))-Math.PI);if(diff>0.75)continue;}bd=d;best=e;}return best;}
function updatePlayer(dt){
  let ix=0,iz=0;if(keys.KeyW||keys.ArrowUp)iz+=1;if(keys.KeyS||keys.ArrowDown)iz-=1;if(keys.KeyA||keys.ArrowLeft)ix-=1;if(keys.KeyD||keys.ArrowRight)ix+=1;
  ix+=joy.x;iz+=joy.y;const il=Math.hypot(ix,iz);if(il>1){ix/=il;iz/=il;}
  const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
  const dx=fx*iz+rx*ix,dz=fz*iz+rz*ix,mag=Math.min(1,Math.hypot(dx,dz));
  const run=keys.ShiftLeft||keys.ShiftRight||Math.hypot(joy.x,joy.y)>0.9;const sp=(run?8:5.2)*(G.fast?1.3:1)*mag;
  if(mag>0.05){moveEntity(player,dx/mag*sp*dt,dz/mag*sp*dt,0.35);const tgt=Math.atan2(dx,dz);let d=((tgt-player.facing+Math.PI*3)%(Math.PI*2))-Math.PI;player.facing+=d*Math.min(1,dt*12);}
  player.speed=sp;player.cd-=dt;player.inv-=dt;
  if((wantShot||keys.Space||keys.KeyJ||holdThrow)&&player.cd<=0){
    const tgt=nearestEnemy(player.x,player.z,26,player.facing);let ax=Math.sin(player.facing),az=Math.cos(player.facing);
    if(tgt){ax=tgt.x-player.x;az=tgt.z-player.z;player.facing=Math.atan2(ax,az);}
    const base=Math.atan2(ax,az),spread=G.rapid?[-0.16,0,0.16]:[0];
    for(const s of spread)fire('player',player.x+Math.sin(base)*0.5,player.z+Math.cos(base)*0.5,Math.sin(base+s),Math.cos(base+s),23,G.dmg);
    player.cd=G.rapid?0.22:0.4;player.p.throwT=0.3;sfx('throw');}
  wantShot=false;
  player.p.root.position.set(player.x,0,player.z);player.p.root.rotation.y=player.facing;animPerson(player.p,player.speed,dt);
  player.p.root.visible=!(player.inv>0&&Math.floor(T*16)%2===0&&G.hp<G.maxHp);
}
const SLOTS=[[-1.5,-1.4],[1.5,-1.4],[0,-2.6],[-2.6,-2.8],[2.6,-2.8],[0,-3.9]];
function updateNPCs(dt){
  nearNPC=null;let bd=3.2;
  for(const n of npcs){
    n.marker.position.y=n.p.top+0.85+Math.sin(T*4)*0.1;
    if(n.kind==='friend')n.marker.visible=!n.recruited&&G.met;
    else if(n.kind==='principal')n.marker.visible=!G.met||G.bossDead;
    else if(n.kind==='nurse')n.marker.visible=G.met&&G.hp<G.maxHp*0.6;
    else n.marker.visible=G.met&&!n.done;
    let speed=0;
    if(n.recruited){
      const f=player.facing,[ox,oz]=SLOTS[n.slot%SLOTS.length];const tx=player.x+Math.cos(f)*ox+Math.sin(f)*oz,tz=player.z-Math.sin(f)*ox+Math.cos(f)*oz;
      const dx=tx-n.x,dz=tz-n.z,d=Math.hypot(dx,dz);
      if(d>35){n.x=player.x;n.z=player.z;}
      else if(d>0.35){speed=Math.min(9,d*3);const st=Math.min(d,speed*dt);moveEntity(n,dx/d*st,dz/d*st,0.3);n.p.root.rotation.y=Math.atan2(dx,dz);}
      n.cd-=dt;const tg=nearestEnemy(n.x,n.z,14);
      if(tg){n.p.root.rotation.y=Math.atan2(tg.x-n.x,tg.z-n.z);if(n.cd<=0){fire('friend',n.x,n.z,tg.x-n.x,tg.z-n.z,18,n.power||1);n.cd=rand(0.9,1.3);n.p.throwT=0.3;}}
      else if(speed<0.1)n.p.root.rotation.y=player.facing;
    } else {
      const dp=Math.hypot(player.x-n.x,player.z-n.z);
      if(dp<6){const tgt=Math.atan2(player.x-n.x,player.z-n.z);let d=((tgt-n.p.root.rotation.y+Math.PI*3)%(Math.PI*2))-Math.PI;n.p.root.rotation.y+=d*Math.min(1,dt*5);}
      if(dp<bd){bd=dp;nearNPC=n;}
    }
    n.p.root.position.set(n.x,0,n.z);animPerson(n.p,speed,dt);
    if(!n.recruited)n.p.body.position.y=Math.abs(Math.sin(T*2+n.p.phase))*0.02;
  }
}
function killEnemy(e,silent){if(e.dead)return;e.dead=true;scene.remove(e.g);enemies.splice(enemies.indexOf(e),1);
  if(silent){burst(e.x,1,e.z,0xffffff,6);return;}
  G.kills++;G.score+=e.score;burst(e.x,e.hitY,e.z,e.type==='boss'?0xf2c230:0xffffff,e.type==='boss'?60:14);popText('+'+e.score,e.x,e.hitY+1,e.z);sfx('kill');
  if(e.type==='boss'){G.bossDead=true;$('bossbar').style.display='none';for(const o of enemies.slice())killEnemy(o,true);banner('打倒考卷大魔王了！回中庭找校長領獎！',4);}
}
function hitEnemy(e,dmg){e.hp-=dmg;e.flash=0.12;sfx('hit');burst(e.x,e.hitY,e.z,0xe8542f,4);if(e.hp<=0)killEnemy(e);}
function damagePlayer(n,fromX,fromZ){if(player.inv>0||G.overlay)return;if(G.shield)n=Math.ceil(n/2);G.hp=Math.max(0,G.hp-n);player.inv=0.7;sfx('hurt');hurtFlash();popText('-'+n,player.x,2,player.z,'#ff6b5b');
  const dx=player.x-fromX,dz=player.z-fromZ,d=Math.hypot(dx,dz)||1;moveEntity(player,dx/d*1.2,dz/d*1.2,0.35);if(G.hp<=0)die();}
function updateEnemies(dt){
  for(const e of enemies.slice()){
    e.t+=dt;e.hitCd-=dt;
    const dx=player.x-e.x,dz=player.z-e.z,d=Math.hypot(dx,dz)||1;
    let mx=dx/d,mz=dz/d;
    if(e.type==='mosquito'){const w=Math.sin(e.t*3+e.wob*5)*0.8;mx+=-dz/d*w;mz+=dx/d*w;}
    for(const o of enemies){if(o===e)continue;const ox=e.x-o.x,oz=e.z-o.z,od=Math.hypot(ox,oz);if(od<e.r+o.r&&od>0.01){mx+=ox/od*0.8;mz+=oz/od*0.8;}}
    const ml=Math.hypot(mx,mz)||1;
    if(d>e.r+0.4)moveEntity(e,mx/ml*e.speed*dt,mz/ml*e.speed*dt,e.r*0.8,e.type==='mosquito'||e.type==='boss');
    e.g.position.set(e.x,0,e.z);e.g.rotation.y=Math.atan2(dx,dz);
    if(e.type==='homework'){e.inner.position.y=Math.abs(Math.sin(e.t*6))*0.3;e.inner.rotation.z=Math.sin(e.t*6)*0.1;}
    else if(e.type==='mosquito'){e.inner.position.y=1.4+Math.sin(e.t*4)*0.25;e.wings[0].rotation.z=Math.sin(e.t*50)*0.6;e.wings[1].rotation.z=-Math.sin(e.t*50)*0.6;}
    else if(e.type==='trouble'){animPerson(e.person,e.speed,dt);}
    else if(e.type==='dragon'){e.inner.position.y=1.2+Math.sin(e.t*2.5)*0.2;e.segs.forEach((sg,k)=>{sg.position.x=Math.sin(e.t*6-k*0.8)*0.12*(k+1);});
      e.shootT-=dt;if(e.shootT<=0&&d<16){e.shootT=rand(2.4,3.4);fire('enemy',e.x+dx/d*0.8,e.z+dz/d*0.8,dx,dz,11,9,1.2,'fire');sfx('boss');}}
    else if(e.type==='boss'){e.inner.position.y=3+Math.sin(e.t*1.5)*0.4;e.arms[0].rotation.x=Math.sin(e.t*3)*0.6;e.arms[1].rotation.x=-Math.sin(e.t*3)*0.6;
      e.shootT-=dt;if(e.shootT<=0){e.shootT=e.hp<e.maxHp/2?1.6:2.4;const n=e.hp<e.maxHp/2?14:10,off=Math.random();for(let i=0;i<n;i++){const a=(i+off)/n*Math.PI*2;fire('enemy',e.x,e.z,Math.sin(a),Math.cos(a),8.5,10,1.2);}sfx('boss');}
      e.summonT-=dt;if(e.summonT<=0){e.summonT=7;for(let i=0;i<3;i++)spawnAt('mosquito',e.x+rand(-3,3),e.z+rand(-3,3));}
      $('bossfill').style.width=(e.hp/e.maxHp*100)+'%';}
    const s=e.flash>0?1.15:1;e.flash-=dt;e.g.scale.setScalar(s);
    if(d<e.r+0.4&&e.hitCd<=0){e.hitCd=1;damagePlayer(e.dmg,e.x,e.z);}
  }
}
function updateShots(dt){
  for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.life-=dt;const p=s.m.position;p.x+=s.vx*dt;p.z+=s.vz*dt;s.m.rotation.x+=dt*10;
    let dead=s.life<=0||inOBB(p.x,p.z,0)||!pip(p.x,p.z,BOUNDW);
    if(!dead&&s.owner!=='enemy'){for(const e of enemies){if(Math.hypot(e.x-p.x,e.z-p.z)<e.r+0.25){hitEnemy(e,s.dmg);dead=true;break;}}}
    if(!dead&&s.owner==='enemy'&&Math.hypot(player.x-p.x,player.z-p.z)<0.65){damagePlayer(s.dmg,p.x-s.vx,p.z-s.vz);dead=true;}
    if(!dead&&s.owner!=='enemy'){for(const c of CIRCLES){if(c.r>0.3&&Math.hypot(c.x-p.x,c.z-p.z)<c.r*0.8){dead=true;break;}}}
    if(dead){scene.remove(s.m);shots.splice(i,1);}}
}
function spawnPoint(minD,maxD){for(let t=0;t<40;t++){const a=Math.random()*Math.PI*2,d=rand(minD,maxD),x=player.x+Math.sin(a)*d,z=player.z+Math.cos(a)*d;if(walkable(x,z)&&!inOBB(x,z,1.5))return [x,z];}return null;}

    banner('考卷大魔王出現在操場了！',3.5);say([['考卷大魔王','哇哈哈哈！我是考卷大魔王！考不完的考卷，全部送給你們！'],['小隊','我們才不怕！大家一起上！']]);}
  spawnT-=dt;if(spawnT>0)return;spawnT=rand(1.4,2.6);
  const alive=enemies.filter(e=>e.type!=='boss').length,cap=G.bossSpawned?5:Math.min(14,6+f*2);if(alive>=cap)return;
  const p=spawnPoint(20,38);if(!p)return;const r=Math.random();spawnAt(r<0.4?'homework':r<0.68?'mosquito':r<0.86||G.kills<4?'trouble':'dragon',p[0],p[1]);
}
function updateParticles(dt){
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.life-=dt;q.vy-=14*dt;q.m.position.x+=q.vx*dt;q.m.position.y=Math.max(0.05,q.m.position.y+q.vy*dt);q.m.position.z+=q.vz*dt;if(q.life<=0){scene.remove(q.m);q.m.material.dispose();parts.splice(i,1);}}
  const v=new THREE.Vector3();
  for(let i=pops.length-1;i>=0;i--){const q=pops[i];q.life-=dt;q.v.y+=dt*1.2;v.copy(q.v).project(camera);q.d.style.left=((v.x+1)/2*innerWidth)+'px';q.d.style.top=((1-v.y)/2*innerHeight)+'px';q.d.style.opacity=Math.min(1,q.life*2);if(q.life<=0||v.z>1){q.d.remove();pops.splice(i,1);}}
}
const ray=new THREE.Raycaster();
function updateCamera(dt){
  const tx=player.x,tz=player.z,ty=1.3;const cp=Math.cos(pitch);
  const dir=new THREE.Vector3(Math.sin(yaw)*cp,Math.sin(pitch),Math.cos(yaw)*cp);let dist=camDist;
  ray.set(new THREE.Vector3(tx,ty,tz),dir);ray.far=camDist;const hit=ray.intersectObjects(BUILD_MESHES,false)[0];if(hit)dist=Math.max(1.2,hit.distance-0.3);
  camera.position.set(tx+dir.x*dist,ty+dir.y*dist,tz+dir.z*dist);camera.lookAt(tx,ty+0.2,tz);
  sun.position.set(tx+40,70,tz+25);sun.target.position.set(tx,0,tz);
}
// ---- minimap ----
const mini=$('mini'),mg=mini.getContext('2d');const MM={x0:-12,y0:-12,x1:618,y1:504};
const miniBase=(()=>{const [c,g]=cv(mini.width,mini.height);const sx=c.width/(MM.x1-MM.x0),sy=c.height/(MM.y1-MM.y0);
  g.drawImage(ground.c,(MM.x0+PAD)*ground.K,(MM.y0+PAD)*ground.K,(MM.x1-MM.x0)*ground.K,(MM.y1-MM.y0)*ground.K,0,0,c.width,c.height);
  g.setTransform(sx,0,0,sy,-MM.x0*sx,-MM.y0*sy);
  for(const b of BUILDINGS){const cs=obbCornersPx(b);g.beginPath();g.moveTo(cs[0][0],cs[0][1]);for(const p of cs.slice(1))g.lineTo(p[0],p[1]);g.closePath();g.fillStyle=b.redRoof?'#b8452f':b.gym?'#cfd3d6':'#9a8f86';g.fill();g.strokeStyle='#333';g.lineWidth=1.2;g.stroke();}
  g.fillStyle='#2f6b30';for(const t of trees){g.beginPath();g.arc(t.px,t.py,4,0,7);g.fill();}
  g.font='bold 15px sans-serif';g.textAlign='center';g.fillStyle='#fff';g.strokeStyle='#000';g.lineWidth=3;
  for(const [t,x,y] of [['操場',422,252],['中庭',200,128],['新元館',256,425],['球場',450,78],['司令台',292,190],['生態池',312,116],['午餐廚房',358,90]]){g.strokeText(t,x,y);g.fillText(t,x,y);}
  return c;})();
function drawMini(){const W=mini.width,H=mini.height,sx=W/(MM.x1-MM.x0),sy=H/(MM.y1-MM.y0);
  mg.setTransform(1,0,0,1,0,0);mg.drawImage(miniBase,0,0);
  const toM=(x,z)=>[((x/S+CX)-MM.x0)*sx,((z/S+CY)-MM.y0)*sy];
  const dot=(x,z,r,c)=>{const [a,b]=toM(x,z);mg.beginPath();mg.arc(a,b,r,0,7);mg.fillStyle=c;mg.fill();mg.lineWidth=1.5;mg.strokeStyle='#000';mg.stroke();};
  for(const e of enemies)dot(e.x,e.z,e.type==='boss'?9:4,'#e23a2c');
  for(const n of npcs)dot(n.x,n.z,5,n.kind==='friend'?'#5fd27a':'#f2c230');
  const goal=objective();if(goal&&Math.floor(T*3)%2===0){const [a,b]=toM(goal.x,goal.z);mg.beginPath();mg.arc(a,b,11,0,7);mg.strokeStyle='#fff';mg.lineWidth=3;mg.stroke();}
  const [px,py]=toM(player.x,player.z);mg.save();mg.translate(px,py);mg.rotate(-player.facing+Math.PI);mg.beginPath();mg.moveTo(0,-10);mg.lineTo(7,7);mg.lineTo(0,3);mg.lineTo(-7,7);mg.closePath();mg.fillStyle='#fff';mg.fill();mg.strokeStyle='#e8542f';mg.lineWidth=2;mg.stroke();mg.restore();}
function objective(){if(!G.met||G.bossDead)return principal;const f=friendsOf().length;
  if(f<G.friendGoal){let best=null,bd=1e9;for(const n of npcs)if(n.kind==='friend'&&!n.recruited){const d=Math.hypot(n.x-player.x,n.z-player.z);if(d<bd){bd=d;best=n;}}return best;}
  const b=enemies.find(e=>e.type==='boss');return b||null;}
// ---- HUD ----
let hudCache='';
function updateHUD(){
  $('hpfill').style.width=(G.hp/G.maxHp*100)+'%';$('hptxt').textContent=`${Math.ceil(G.hp)}/${G.maxHp}`;$('score').textContent=G.score;const f=friendsOf().length;$('fcount').textContent=f;
  const qs=[[G.met,'到中庭向校長報到'],[f>=G.friendGoal,`找同學組隊 (${Math.min(f,G.friendGoal)}/${G.friendGoal})`],[G.kills>=G.killGoal,`打倒怪獸 (${Math.min(G.kills,G.killGoal)}/${G.killGoal})`],[G.bossDead,G.bossSpawned?'在操場打倒考卷大魔王':'？？？（完成上面任務後出現）'],[G.won,'回中庭找校長領獎']];
  const isCur=i=>!qs[i][0]&&(i===0||(i<3?G.met:qs.slice(0,i).every(q=>q[0])));
  const html=qs.map(([d,t],i)=>`<li class="${d?'done':isCur(i)?'cur':''}">${d?'☑':'☐'} ${t}</li>`).join('');
  const buffs=(G.dmg>1?'<span>💪 攻擊加倍</span>':'')+(G.rapid?'<span>⚡ 躲避球連發</span>':'')+(G.shield?'<span>🫧 泡泡護盾</span>':'')+(G.fast?'<span>👟 跳跳鞋</span>':'');
  const key=html+buffs;if(key!==hudCache){hudCache=key;$('quests').innerHTML=html;$('buffs').innerHTML=buffs;}
  const pr=$('prompt');if(nearNPC&&!dlg&&!G.overlay&&G.started){pr.style.display='block';pr.textContent=isTouch?`點「對話」和 ${nearNPC.name} 說話`:`按 E 和 ${nearNPC.name} 說話`;$('bTalk').classList.add('hot');}else{pr.style.display='none';$('bTalk').classList.remove('hot');}
  if(bannerT>0){bannerT-=1/60;if(bannerT<=0)$('banner').style.opacity=0;}
}
function waveFlag(){const pa=flagGeo.attributes.position;for(let i=0;i<pa.count;i++){const x=flagBase[i*3];pa.setZ(i,Math.sin(x*2.2-T*5)*0.18*(x/3));}pa.needsUpdate=true;}

function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,clock.getDelta());T+=dt;
  const paused=!G.started||!!dlg||G.overlay;
  if(!paused){G.time+=dt;updatePlayer(dt);updateEnemies(dt);updateShots(dt);spawner(dt);}
  else{player.p.root.position.set(player.x,0,player.z);animPerson(player.p,0,dt);}
  updateNPCs(paused?0:dt);updateParticles(dt);updateCars(dt);waveFlag();updateCamera(dt);updateHUD();drawMini();
  renderer.render(scene,camera);
}
logoImg.src=LOGO_SRC;
loop();
window.__game={G,player,enemies,npcs,interact,spawnAt};
})();
</script>
