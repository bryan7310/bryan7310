<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>志瑞螺絲智能ERP</title>
<link rel="icon" type="image/png" href="img/logo-icon.png">
<link rel="apple-touch-icon" href="img/logo-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" class="app">
  <aside class="rail" id="rail" aria-label="主選單">
    <a class="brand" href="#home"><span class="logo" aria-hidden="true"></span><span><b>志瑞螺絲</b><small>智能 ERP</small></span></a>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <div class="sync" id="sync"><i></i><span>連線中…</span></div>
      <div class="me" id="me"></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu" id="menuBtn" aria-label="選單"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="crumb" id="crumb"></div>
      <div class="gsearch"><input type="search" id="gq" placeholder="搜尋客戶、商品、單號…（Ctrl+K）" autocomplete="off" aria-label="全站搜尋"><div class="gres" id="gres" hidden></div></div>
      <div class="top-actions" id="topActions"></div>
    </header>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="modal-host" id="modals"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
