<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>標籤機</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--ink:#1f2328;--mute:#6b7280;--line:#d8dce2;--pri:#1d5fbf;--pri-ink:#fff;--danger:#c0392b;--warn-bg:#fff4d6;--side:#22303f;--side-ink:#dce3ea;--sel:#e3edfb;--hover:#f2f6fc;--head:#eef1f5}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 "Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;color:var(--ink);background:var(--bg)}
#top{position:fixed;top:0;left:0;right:0;height:42px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);z-index:40}
#top .brand{color:var(--ink);text-decoration:none;font-size:16px;white-space:nowrap}
#top .brand span{color:var(--mute);font-size:13px}
.spacer{flex:1}
.qwrap{position:relative}
#menuQ{width:180px}
.qwrap .dd{right:0;left:auto;min-width:260px}
.qwrap.open .dd{display:block}
.qwrap .dd small{color:var(--mute)}
#menubar{position:fixed;top:42px;left:0;right:0;height:34px;display:flex;align-items:stretch;background:#f7f7f5;border-bottom:1px solid var(--line);padding:0 6px;z-index:30;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#menubar::-webkit-scrollbar{display:none}
#menubar .mg{position:relative;display:flex}
#menubar .mg-h{background:none;border:0;color:var(--ink);font:inherit;font-size:14px;padding:0 11px;cursor:pointer;white-space:nowrap;text-decoration:none;display:flex;align-items:center}
#menubar .mg-h i{font-style:normal;font-size:10px;opacity:.6}
#menubar .mg-h:hover,#menubar .mg.open .mg-h{background:#dfe8f6}
#menubar .mg.cur .mg-h{box-shadow:inset 0 -3px 0 var(--pri);color:var(--pri)}
.dd{display:none;position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:0 0 6px 6px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px 0;min-width:190px;max-height:calc(100vh - 90px);overflow:auto;z-index:50}
.qwrap .dd{position:absolute;margin-top:4px;top:100%}
.dd.cols{column-count:2;column-gap:0;min-width:380px}
#menubar .mg.open .dd{display:block}
.dd .mi{display:block;padding:6px 16px;color:var(--ink);text-decoration:none;font-size:14px;white-space:nowrap;break-inside:avoid}
.dd .mi:hover,.dd .mi:focus{background:var(--hover);outline:none}
.dd .mi.on{background:var(--sel);color:var(--pri);font-weight:bold}
#iconbar{position:fixed;top:76px;left:0;right:0;height:48px;display:flex;align-items:center;gap:0;background:#eef1f5;border-bottom:1px solid var(--line);padding:0 6px;z-index:20;overflow-x:auto;scrollbar-width:none}
#iconbar::-webkit-scrollbar{display:none}
.ib-g{display:flex;align-items:center;padding:0 6px;border-right:1px solid #cdd3db}
.ib-g:last-child{border-right:0}
.ib{display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:6px;color:var(--ink);text-decoration:none;white-space:nowrap;font-size:14px}
.ib .ic{font-size:22px;line-height:1}
.ib:hover{background:#dde5f0}
.ib.on{background:var(--sel);color:var(--pri)}
#wrap{padding-top:124px;height:100%}
#main{height:100%;overflow:auto;padding:14px 18px 60px;min-width:0}
.page-head h2{margin:0 0 10px;font-size:19px}
h3{font-size:15px;margin:18px 0 8px}
.btn{display:inline-block;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:5px 12px;border-radius:5px;cursor:pointer;font:inherit;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:#e6b4ae}
.btn.ghost{border-color:transparent;background:transparent;font-size:18px;padding:2px 8px}
.btn.sm{padding:2px 8px;font-size:12.5px}
.inp{border:1px solid var(--line);border-radius:4px;padding:4px 7px;font:inherit;background:#fff;color:var(--ink);min-width:0}
.inp:focus,.cell:focus{outline:2px solid #9cc0f5;outline-offset:-1px}
.inp:disabled{background:#f1f2f4;color:#555}
.r{text-align:right}.c{text-align:center}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px}
.fbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px;background:var(--panel);padding:8px;border:1px solid var(--line);border-radius:6px}
.grid-wrap{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:auto;max-height:calc(100vh - 210px)}
table.grid{border-collapse:collapse;width:100%;font-size:13.5px}
table.grid th{position:sticky;top:0;background:var(--head);text-align:left;font-weight:normal;color:#374151;padding:6px 8px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;z-index:1}
table.grid th.r{text-align:right}
table.grid th.sorted{color:var(--pri)}
table.grid td{padding:5px 8px;border-bottom:1px solid #eceef1;white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis}
table.grid tbody tr:hover{background:var(--hover);cursor:pointer}
table.grid tr.sel{background:var(--sel)}
table.grid tfoot td{background:var(--head);font-weight:bold;position:sticky;bottom:0}
table.grid.edit td{padding:1px 2px}
table.grid.edit tbody tr:hover{cursor:default}
table.grid.edit tfoot td{position:static;font-weight:normal;background:#fafbfc;padding:6px}
.cell{width:100%;border:1px solid transparent;padding:4px 5px;font:inherit;background:transparent}
.cell:hover{border-color:var(--line)}
.del{color:#b5b9c0;cursor:pointer;padding:0 6px}.del:hover{color:var(--danger)}
.more,.empty{padding:10px;color:var(--mute);text-align:center}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:10px}
.form label.f{display:flex;align-items:center;gap:6px;min-width:0}
.form label.f>span:first-child{width:78px;flex:none;color:#4b5563;font-size:13px;text-align:right}
.form label.f .inp{flex:1}
.form label.f input[type=checkbox]{width:18px;height:18px}
.form label.w2{grid-column:span 2}.form label.w3{grid-column:1/-1}.form label.wide{grid-column:1/-1;align-items:flex-start}
.form .f-sep{grid-column:1/-1;font-weight:bold;color:var(--pri);border-bottom:1px solid var(--line);padding-top:6px}
.pick-name{color:var(--pri);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.req{color:var(--danger);font-style:normal}
.lines{margin-bottom:8px}
.lines .grid{background:var(--panel);border:1px solid var(--line)}
.totals{display:flex;flex-wrap:wrap;gap:22px;justify-content:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin-bottom:10px}
.totals .big{font-size:17px}
.cards{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;cursor:pointer;min-width:180px}
.card:hover{border-color:var(--pri)}
.card.big{width:300px}.card h3{margin:0 0 6px;color:var(--pri)}
.card.stat .sl{color:var(--mute);font-size:13px}.card.stat .sv{font-size:22px;font-weight:bold;margin-top:4px}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:12px}
.box h3{margin-top:0}
.note{color:var(--mute);font-size:13px}
.warn{background:var(--warn-bg);border:1px solid #f1d58a;padding:8px 12px;border-radius:6px;margin:0 0 12px}
.opt{display:block;padding:8px 0;cursor:pointer}
.log{background:var(--panel);border:1px solid var(--line);padding:10px;border-radius:6px;white-space:pre-wrap;min-height:40px}
pre.err{color:var(--danger);white-space:pre-wrap}
.pre{white-space:pre-wrap;margin-bottom:8px}
.m-bg{position:fixed;inset:0;background:rgba(15,23,42,.35);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding-top:6vh}
.modal{background:var(--panel);border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.25);width:460px;max-width:96vw;max-height:88vh;display:flex;flex-direction:column}
.m-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.m-head .x{cursor:pointer;font-size:20px;color:var(--mute)}
.m-body{padding:14px;overflow:auto}
.m-foot{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.picker .inp{margin-bottom:8px}.picker .grid-wrap{max-height:55vh}
.busy .m-body{display:flex;align-items:center;gap:12px}
.spin{width:22px;height:22px;border:3px solid #cfd8e3;border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);opacity:0;background:#1f2937;color:#fff;padding:9px 18px;border-radius:6px;z-index:200;transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.err{background:var(--danger)}
.rep-sum{display:flex;gap:20px;flex-wrap:wrap;margin:6px 0 10px}
.rep-sum b{font-size:16px}
tr.neg td{color:var(--danger)}
@media (max-width:820px){
  #menuQ{width:110px}#top .brand span{display:none}
  .ib span:not(.ic){font-size:12px}.ib{flex-direction:column;gap:0;padding:2px 7px}#iconbar{height:52px}#wrap{padding-top:132px}
  #main{padding:10px 12px 60px}
  .form{grid-template-columns:1fr}.form label.w2{grid-column:auto}
  .card.big{width:100%}
}
.pv-modal{max-height:94vh}.pv-modal .m-body{padding:8px}
.pv-frame{width:100%;height:72vh;border:1px solid var(--line);background:#888}
.pdlg fieldset{border:1px solid var(--line);border-radius:6px;margin:0 0 12px;padding:8px 12px}
.pdlg legend{color:var(--pri);padding:0 4px}
.pdlg .inp{margin:2px 0}
.toolbar .sep{color:var(--mute);margin-left:10px;font-size:13px}
.fd .fd-main{display:flex;gap:10px;align-items:flex-start}
.fd-wrap{flex:1;min-width:0;overflow:auto;max-height:calc(100vh - 230px);background:#9aa3ad;border-radius:6px;padding:14px}
.fd-canvas{outline:none}
.fd-page{background:#fff;margin:0 auto;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.fd-bh{background:#e8edf3;color:#4b5563;font-size:12px;padding:2px 6px;border-top:1px solid #c5ccd5;cursor:pointer;user-select:none}
.fd-bh.on{background:#cfe0f7;color:var(--pri)}
.fd-band{position:relative;background-image:linear-gradient(#eef1f4 1px,transparent 1px),linear-gradient(90deg,#eef1f4 1px,transparent 1px);background-size:16px 16px;overflow:hidden}
.fd-grip{height:5px;background:#c5ccd5;cursor:ns-resize}.fd-grip:hover{background:var(--pri)}
.fd-it{position:absolute;box-sizing:border-box;cursor:move;display:flex;align-items:center;white-space:nowrap;overflow:hidden;line-height:1.1;user-select:none}
.fd-label,.fd-field,.fd-calc,.fd-sys{outline:1px dashed #c3c9d1}
.fd-field,.fd-calc{background:rgba(29,95,191,.06)}
.fd-it.sel{outline:2px solid var(--pri);z-index:5;overflow:visible}
.fd-rs{position:absolute;right:-5px;bottom:-5px;width:9px;height:9px;background:var(--pri);cursor:nwse-resize}
.fd-props{width:300px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;max-height:calc(100vh - 230px);overflow:auto}
.fd-props .form{grid-template-columns:1fr;border:0;padding:0;margin-bottom:6px}
.fd-props .form label.f>span:first-child{width:70px}
.fd-props .form label.w2,.fd-props .form label.w3{grid-column:auto}
.fd-props .note{white-space:pre-wrap}
.fd-kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px}
/* 單據編輯：右側歷史交易 */
.bill-body{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.bill-body .lines{flex:1;min-width:0;overflow-x:auto;margin-bottom:0}
.hist{flex:none;width:400px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px}
.hist.closed{width:auto}
.hist.closed .hist-f,.hist.closed .hist-body{display:none}
.hist-t{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.hist-t a{text-decoration:none;font-size:15px;padding:0 4px}
.hist-f{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.hist-q{flex:1;min-width:100px;padding:3px 6px}
.hist-body{max-height:420px;overflow:auto}
table.hist-g{width:100%;font-size:12.5px}
table.hist-g td,table.hist-g th{padding:2px 4px;white-space:nowrap}
table.hist-g td.nm{max-width:150px;overflow:hidden;text-overflow:ellipsis}
table.hist-g tbody tr{cursor:pointer}
table.hist-g tbody tr:hover{background:#e8f0fe}
table.hist-g tr.ret td{color:#c00}
@media (max-width:1100px){.bill-body{flex-direction:column}.hist{width:auto;align-self:stretch}}
.bill-nav{display:inline-flex;gap:4px;align-items:center;margin-right:10px}.bill-nav .note{margin-left:4px;white-space:nowrap}

/* 標籤設計 */
.lbd-canvas{outline:none;display:flex;flex-direction:column;align-items:safe center;gap:8px;padding:10px}
.lbd-label{position:relative;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.35);border-radius:1.2mm;overflow:hidden;color:#000}
.lbd-it{position:absolute;box-sizing:border-box;cursor:move;outline:.15mm dashed rgba(29,95,191,.35);user-select:none}
.lbd-it.sel{outline:.3mm solid var(--pri);z-index:5}
.lbd-it.sel .fd-rs{width:1.6mm;height:1.6mm;right:-.8mm;bottom:-.8mm}
.lbd-info{background:rgba(255,255,255,.85);padding:2px 8px;border-radius:4px}
table.lblp td{max-width:240px}

html,body{height:auto;overflow:auto;background:#fff}
</style>

<script>
/* ---- util.js ---- */
/* util.js — 共用小工具 */
(function (G) {
  'use strict';
  const U = {};

  U.pad = (n, w) => String(n).padStart(w, '0');
  U.today = () => { const d = new Date(); return d.getFullYear() + '-' + U.pad(d.getMonth() + 1, 2) + '-' + U.pad(d.getDate(), 2); };
  U.ymd = d => d.getFullYear() + '-' + U.pad(d.getMonth() + 1, 2) + '-' + U.pad(d.getDate(), 2);
  U.addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return U.ymd(d); };
  U.monthStart = s => (s || U.today()).slice(0, 8) + '01';
  U.monthEnd = s => { const d = new Date((s || U.today()).slice(0, 8) + '01T00:00:00'); d.setMonth(d.getMonth() + 1); d.setDate(0); return U.ymd(d); };
  U.d10 = s => (s ? String(s).slice(0, 10) : '');

  // 數字
  U.num = v => { if (v == null || v === '') return 0; const n = typeof v === 'number' ? v : parseFloat(String(v).replace(/,/g, '')); return isFinite(n) ? n : 0; };
  U.round = (v, d = 0) => { const p = Math.pow(10, d); return Math.round((U.num(v) + Number.EPSILON) * p) / p; };
  U.fmt = (v, d = 0) => { const n = U.num(v); if (!n) return n === 0 && v !== '' && v != null ? '0' : ''; return n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }); };
  U.fmtQ = v => { const n = U.num(v); if (!n) return ''; return n.toLocaleString('en-US', { maximumFractionDigits: 4 }); };
  U.money = v => U.fmt(v, 0);

  // 關鍵字搜尋：空白或逗號分隔，每個字都要有；不分大小寫、全形半形
  U.norm = s => String(s == null ? '' : s).replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xfee0)).replace(/　/g, ' ').toLowerCase();
  U.qTerms = q => U.norm(q).split(/[\s,，、]+/).filter(Boolean);
  U.matchQ = (text, terms) => { if (!terms.length) return true; const t = U.norm(text); return terms.every(w => t.includes(w)); };

  U.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  U.trim = s => (s == null ? '' : String(s).trim());

  // 金額轉中文大寫（支票用）
  U.chineseMoney = n => {
    n = Math.round(U.num(n)); if (!n) return '零元整';
    const d = '零壹貳參肆伍陸柒捌玖', u = ['', '拾', '佰', '仟'], big = ['', '萬', '億', '兆'];
    let s = '', i = 0, zero = false;
    while (n > 0) {
      const g = n % 10000; n = Math.floor(n / 10000);
      if (g) {
        let gs = '', z = false, x = g;
        for (let k = 0; k < 4; k++) { const dd = x % 10; x = Math.floor(x / 10); if (dd) { gs = d[dd] + u[k] + (z ? '零' : '') + gs; z = false; } else if (gs) z = true; }
        s = gs + big[i] + (zero ? '零' : '') + s; zero = g < 1000;
      } else if (s) zero = true;
      i++;
    }
    return s.replace(/^零+/, '') + '元整';
  };

  U.download = (name, data, type) => {
    const blob = data instanceof Blob ? data : new Blob([data], { type: type || 'application/octet-stream' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  };

  // CSV（Excel 可開，含 BOM）
  U.csv = (rows, cols) => {
    const q = v => { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    return '﻿' + [cols.map(c => q(c.label || c.key)).join(',')].concat(rows.map(r => cols.map(c => q(c.csv ? c.csv(r) : (c.get ? c.get(r) : r[c.key]))).join(','))).join('\r\n');
  };

  U.gzip = async (str) => new Uint8Array(await new Response(new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
  U.gunzip = async (u8) => await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'))).text();

  U.debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  U.sum = (arr, f) => arr.reduce((s, x) => s + U.num(f ? f(x) : x), 0);
  U.groupBy = (arr, f) => { const m = new Map(); for (const x of arr) { const k = f(x); let a = m.get(k); if (!a) m.set(k, a = []); a.push(x); } return m; };
  U.uniq = arr => [...new Set(arr)];

  G.U = U;
})(window);

</script>
<script>
/* ---- ui.js ---- */
/* ui.js — 畫面共用元件 */
(function (G) {
  'use strict';
  const UI = {};

  // DOM 建構
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'value') el.value = v;
      else if (k === 'checked') el.checked = !!v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : document.createTextNode(c));
    return el;
  }
  UI.h = h;
  UI.clear = el => { while (el.firstChild) el.firstChild.remove(); return el; };

  UI.toast = (msg, kind) => {
    const t = h('div', { class: 'toast ' + (kind || '') }, msg);
    document.body.append(t); setTimeout(() => t.classList.add('show'), 10);
    setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, kind === 'err' ? 5000 : 2500);
  };

  // 對話框
  UI.modal = function (title, body, buttons, opts) {
    opts = opts || {};
    return new Promise(res => {
      const close = v => { bg.remove(); document.removeEventListener('keydown', onKey, true); res(v); };
      const foot = h('div', { class: 'm-foot' }, (buttons || [{ label: '關閉', value: null }]).map(b =>

  const isAscii = (d, p, n) => { for (let i = 0; i < n; i++) if (d[p + i] < 0x20 || d[p + i] > 0x7e) return false; return true; };

  // 標籤尺寸：開頭附近 [寬, ?, 寬, 高]（0.01mm）
  function labelSize(c) {
    for (let p = 8; p < Math.min(c.length - 16, 1200); p++) {
      const w = i32(c, p), x = i32(c, p + 4), w2 = i32(c, p + 8), hh = i32(c, p + 12);
      if (w >= 500 && w <= 30000 && w === w2 && hh >= 500 && hh <= 60000 && x > 0 && x <= hh) return { w: w / 100, h: hh / 100 };
    }
    return null;
  }
  function printerName(c) {
    const s = [...c.subarray(0, Math.min(c.length, 4000))].map(b => (b >= 0x20 && b < 0x7f ? String.fromCharCode(b) : '\u0000')).join('');
    const m = s.match(/[\x20-\x7e]{3,}(?=\u0000+winspool)/) || s.match(/(?:Gprinter|GP-|Godex|TSC|Zebra|Argox|Xprinter)[\x20-\x7e]*/i);
    return m ? m[0].trim() : '';
  }

  // 變數：id, 1000+id, len, 'Prompt1' … 後面 80 bytes 是提示文字；日期變數帶格式
  function variables(c) {
    const vars = {};
    for (let p = 6; p < c.length - 20; p++) {
      const n = i16(c, p); if (n < 3 || n > 40 || c[p + 2 + n - 1] !== 0 || !isAscii(c, p + 2, n - 1)) continue;
      const id = i16(c, p - 4); if (id <= 0 || i16(c, p - 2) !== 1000 + id) continue;
      const name = String.fromCharCode(...c.subarray(p + 2, p + 1 + n));
      if (!/^[A-Za-z]/.test(name)) continue;
      const v = { id, name, prompt: '', date: '' };
      const q = p + 80; const ln = i16(c, q);
      if (/^Prompt/i.test(name) && ln > 0 && ln < 60) v.prompt = cstr(c, q + 2, ln + 1).replace(/\0/g, '').trim();
      if (/^Date/i.test(name) || /^日期/.test(name)) { // 日期格式（取最後一個，像 YYYY/M/D）
        const seg = c.subarray(p, Math.min(c.length, p + 160));
        const fm = [...String.fromCharCode(...seg).matchAll(/[YMDymd][YMDymd.\/\- ]{2,}[YMDymd]/g)].map(m => m[0]);
        v.date = fm.length ? fm[fm.length - 1] : 'YYYY/M/D';
      }
      vars[id] = v; p += n;
    }
    return vars;
  }

  // 文字物件：標記(2d 01 / 35 01)＋4 個 int32 框(0.01mm)＋…＋[變數id][序][長度]文字\0[字高(-0.1pt)]…[粗細]…字型名稱
  function texts(d, src) {
    const out = [];
    for (let m = 0; m < d.length - 80; m++) {
      if (!((d[m] === 0x2d || d[m] === 0x35) && d[m + 1] === 0x01)) continue;
      const L = i32(d, m + 4), T = i32(d, m + 8), R = i32(d, m + 12), B = i32(d, m + 16);
      if (!(L >= -2000 && T >= -2000 && R > L && B > T && R < 200000 && B < 200000)) continue;
      for (const dq of [64, 65, 63, 66, 62, 67, 61, 68, 60, 69, 70, 71, 72, 58, 59, 73, 74, 75, 76]) {
        const q = m + dq, len = i16(d, q); if (len < 1 || len > 4000) continue;
        const e = q + 2 + len; if (e + 20 > d.length || d[e - 1] !== 0) continue;
        const fh = i16(d, e); if (fh > -5 || fh < -3000) continue;
        const wt = i16(d, e + 8);
        let text; try { text = dec(d.subarray(q + 2, e - 1)); } catch (x) { continue; }
        if (!text || /[\x00-\x08\x0b\x0c\x0e-\x1f\ufffd]/.test(text)) continue;
        let font = cstr(d, e + 18, 64);
        if (!font || /[\x00-\x1f]/.test(font)) font = '';
        out.push({ src, box: [L / 100, T / 100, R / 100, B / 100], vid: i16(d, q - 4), text, pt: -fh / 10, bold: wt >= 600, font });
        m = e; break;
      }
    }
    return out;
  }

  // ===== 轉樣板 =====
  const FIELD = [[/品名|名稱/, '品名'], [/規格/, '規格'], [/數量|qty/i, '數量'], [/料號|貨號|品號|貨品編號|編號/, '貨品編號'], [/單位/, '單位'], [/條碼/, '條碼編號'], [/售價|價格/, '標準售價']];
  function placeholder(v, vid) {
    if (!v) return '{輸入:變數' + vid + '}';
    if (v.date) return '{今天:' + v.date.toLowerCase() + '}';
    const p = v.prompt || v.name;
    for (const [re, k] of FIELD) if (re.test(p) && !/單號/.test(p)) return '{' + k + '}';
    return '{輸入:' + p + '}';
  }
  const FONT_MAP = { 'MingLiU': '細明體', 'PMingLiU': '新細明體', 'Microsoft JhengHei': '微軟正黑體', 'DFKai-SB': '標楷體' };
  const LH = f => /正黑|JhengHei|Arial|雅黑/i.test(f) ? 1.45 : 1.1; // 字型行高（字高的倍數）
  const MM = 0.3528; // 1pt = 0.3528mm

  let ctx;
  function textW(s, font, pt) {
    try { ctx = ctx || document.createElement('canvas').getContext('2d'); ctx.font = pt * MM * 4 + 'px "' + font + '"'; return ctx.measureText(s).width / 4; }
    catch (e) { let w = 0; for (const ch of s) w += ch.charCodeAt(0) > 0x2e80 ? 1 : ch === ' ' ? 0.3 : 0.55; return w * pt * MM; }
  }

  function toTemplate(f, fileName) {
    const c = f.stream('Contents');
    if (!c) throw new Error('檔案裡找不到標籤內容（Contents）');
    const size = labelSize(c) || { w: 50, h: 40 };
    const prn = printerName(c);
    const vars = variables(c);
    let objs = texts(c, 'c');
    const v30 = f.stream('V30 Data'); if (v30) objs = objs.concat(texts(v30, 'v'));
    const seen = new Set();
    objs = objs.filter(o => { const k = o.box.join() + '|' + o.vid + '|' + o.text; if (seen.has(k)) return false; seen.add(k); return true; });

    // NiceLabel 物件框會依實際字高自動長高：用單行物件的框高推算字型放大倍率
    const ks = objs.filter(o => !o.text.includes('\n')).map(o => (o.box[3] - o.box[1]) / (o.pt * MM * LH(o.font))).filter(k => k > 0.7 && k < 2.5).sort((a, b) => a - b);
    const k = ks.length ? Math.min(2, Math.max(0.9, ks[ks.length >> 1])) : 1;
    const r1 = v => Math.round(v * 10) / 10, r2 = v => Math.round(v * 100) / 100;

    const items = [];
    const singles = objs.filter(o => !o.text.includes('\n'));
    for (const o of objs) {
      const fontName = FONT_MAP[o.font] || o.font || '微軟正黑體', pt = r1(o.pt * k), em = pt * MM;
      const font = { name: fontName, size: pt, bold: o.bold };
      const [L, T, R, B] = o.box, maxR = Math.min(R, size.w);
      if (o.vid) {
        items.push({ t: 'text', x: r2(L), y: r2(T), w: r2(Math.max(2, maxR - L)), h: r2(Math.min(B, size.h) - T), text: placeholder(vars[o.vid], o.vid), font, align: 'left', fit: true });
        continue;
      }
      const lines = o.text.split(/\r?\n/);
      // 多行說明文字：每行對齊旁邊的變數欄位那一列
      let pitch = em * (LH(fontName) + 0.2), c0 = T + pitch / 2;
      if (lines.length > 1) {
        const cy = singles.filter(s => s.vid && s.box[1] >= T - 1 && s.box[3] <= B + 1 && s.box[0] < R).map(s => (s.box[1] + s.box[3]) / 2);
        if (cy.length >= 2) {
          let best = 1e9;
          for (let p = em * 1.0; p <= em * 3.2; p += 0.05) for (let z = 0.2; z <= 0.8; z += 0.05) {
            const c00 = T + p * z; let err = 0;
            for (const y of cy) { const i = Math.min(lines.length - 1, Math.max(0, Math.round((y - c00) / p))); err += Math.abs(y - (c00 + i * p)); }
            if (err < best - 1e-6) { best = err; pitch = p; c0 = c00; }
          }
        }
      }
      const lh = Math.min(pitch, em * LH(fontName) * 1.15);
      lines.forEach((ln, i) => {
        const y = c0 + i * pitch - lh / 2;
        if (y > size.h) return;
        // 用很多空白排版的一行拆成幾段，各自定位
        const segs = []; let re = /\S+(?: ?\S+)*/g, mm;
        while ((mm = re.exec(ln))) segs.push({ s: mm[0], x: L + textW(ln.slice(0, mm.index), fontName, pt) });
        segs.forEach((g, j) => {
          const nx = j + 1 < segs.length ? segs[j + 1].x - 0.3 : maxR;
          const w = Math.max(textW(g.s, fontName, pt) + 1, nx - g.x);
          items.push({ t: 'text', x: r2(g.x), y: r2(y), w: r2(Math.min(w, size.w - g.x)), h: r2(lh), text: g.s, font, align: 'left', fit: false });
        });
      });
    }
    // 文字放大後若超出標籤右邊就往內縮
    for (const it of items) { if (it.x + it.w > size.w) it.w = r2(Math.max(2, size.w - it.x)); if (it.y + it.h > size.h) it.h = r2(Math.max(1, size.h - it.y)); }
    return {
      name: String(fileName || 'NiceLabel').replace(/\.lbl$/i, '') + ' ' + size.w + '×' + size.h,
      w: size.w, h: size.h, cols: 1, gapX: 2, ox: 0, oy: 0,
      printer: /3120/.test(prn) ? 'gp3120tu' : /1324|GP|Gprinter/i.test(prn) ? 'gp1324d' : 'gp1324d',
      src: 'goods', items,
      _info: { printer: prn, vars: Object.values(vars), scale: k, objects: objs.length, damaged: c.got < c.length || (v30 && v30.got < v30.length) }
    };
  }

  G.LBL = { cfb, parse: (buf, fileName) => toTemplate(cfb(buf), fileName), _: { variables, texts, labelSize, printerName } };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ---- nl_shim.js ---- */
/* nl_shim.js — 讓標籤模組（m_labels.js）獨立執行：給其他系統嵌入用（例如其他網頁 ERP 的「標籤機」分頁）
   主系統可在 parent.NL_HOST 提供：
     goods()   → [{ id, code, name, spec, unit, salePrice, note }]
     company() → { name, short, tel, fax, addr, taxId }
     take()    → 待印項目 [{ gid, name, pn, spec, po, qty, billNo }]（取走後主系統清掉） */
(function (G) {
  'use strict';
  const host = () => { try { return (G.parent && G.parent !== G && G.parent.NL_HOST) || G.NL_HOST || null; } catch (e) { return G.NL_HOST || null; } };
  const KEY = 'nl-label-meta';

  // ===== 資料 =====
  let meta = {};
  try { meta = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { meta = {}; }
  let gCache = null, gAt = 0;
  const goods = () => {
    if (gCache && Date.now() - gAt < 3000) return gCache;
    const H = host(); let a = [];
    try { a = H && H.goods ? H.goods() : []; } catch (e) { a = []; }
    gCache = a.map(g => ({ _id: g.id, 貨品編號: String(g.code || g.id || '').trim(), 品名: g.name || '', 規格: g.spec || '', 基本單位: g.unit || '', 標準售價: +g.salePrice || 0, 備註: g.note || '' }));
    gAt = Date.now(); return gCache;
  };
  const gIdx = () => new Map(goods().map(g => [g.貨品編號, g]));
  G.S = {
    get meta() { return meta; },
    setMeta(k, v) { meta[k] = v; },
    async save() { try { localStorage.setItem(KEY, JSON.stringify(meta)); } catch (e) { UI.alert('標籤樣板存檔失敗：' + e.message); } },
    rows(t) { return t === '貨品主檔' ? goods() : []; },
    get idx() { return { goods: gIdx(), supp: new Map(), cust: new Map() }; },
    company() { const H = host(); let c = {}; try { c = H && H.company ? H.company() || {} : {}; } catch (e) { } return { 公司名稱: c.name || '', 公司簡稱: c.short || c.name || '', 電話: c.tel || '', 傳真: c.fax || '', 地址: c.addr || '', 統一編號: c.taxId || '' }; },
    hasData: () => true
  };
  G.C = { TYPES: {}, HEAD: {}, type: () => ({ name: '', tbl: '' }), partyMap: () => new Map(), partyName: () => '', stockOf: () => '' };
  G.G = G; G.billLines = () => [];
  G.LBL_NO_BILL = true; // 主系統從自己的銷貨單「標籤」按鈕導入

  // ===== 畫面切換（不用網址 #，避免影響外層） =====
  const A = G.A = { routes: {}, cur: 'T00031' };
  A.reg = (code, fn) => { A.routes[code] = fn; };
  A.go = code => { A.cur = code; render(); };
  async function render() {
    const main = document.getElementById('main'); if (!main) return;
    const [code, ...rest] = A.cur.split('/');
    document.querySelectorAll('#nlnav button').forEach(b => b.classList.toggle('pri', b.dataset.r === code));
    UI.clear(main);
    try { const el = await A.routes[code](rest.map(decodeURIComponent)); if (el) main.append(el); }
    catch (e) { console.error(e); main.append(h('pre', { class: 'err' }, e.stack || String(e))); }
  }
  G.addEventListener('hashchange', render); // m_labels 用 hashchange 要求重畫

  // 預覽
  G.previewHtml = (title, r) => {
    const fr = h('iframe', { class: 'pv-frame', style: { width: '100%', height: '70vh', border: '1px solid #ccc', background: '#888' } });
    fr.srcdoc = '<!doctype html><html><head><meta charset="utf-8"><style>' + G.PRINT_CSS + r.css + 'html,body{background:#888}body{margin:0;padding:10px}</style></head><body>' + r.html + '</body></html>';
    return UI.modal('預覽　' + title, h('div', null, h('div', { class: 'toolbar' }, UI.btn('🖨 列印', () => { fr.contentWindow.focus(); fr.contentWindow.print(); }, 'pri')), fr), [{ label: '關閉', value: null }], { width: '92vw', noFocus: true });
  };

  // 主系統導入的待印項目 → 標籤列印畫面
  G.NL_PULL = () => {
    const H = host(); let a = [];
    try { a = H && H.take ? H.take() || [] : []; } catch (e) { a = []; }
    if (!a.length) return false;
    gCache = null;
    const byId = new Map(goods().map(g => [g._id, g]));
    A.pendingLabel = {
      rows: a.map(it => {
        const g = byId.get(it.gid) || {};
        return Object.assign({}, g, {
          貨品編號: it.pn || g.貨品編號 || '', 品名: it.name || g.品名 || '', 規格: g.規格 || '', 料號: it.pn || '', 客料號: it.pn || '',
          短文: it.spec || '', 採購單號: it.po || '', 單號: it.billNo || '', 數量: it.qty === '' || it.qty == null ? '' : +it.qty || 0
        });
      })
    };
    A.go('T00032'); return true;
  };

  G.NL_START = () => {
    document.body.append(
      h('div', { id: 'nlnav', class: 'toolbar', style: { padding: '8px 14px 0', margin: 0 } },
        h('button', { class: 'btn', 'data-r': 'T00032', onclick: () => A.go('T00032') }, '🖨 標籤列印'),
        h('button', { class: 'btn', 'data-r': 'T00031', onclick: () => A.go('T00031') }, '✏ 標籤設計／匯入 .lbl')),
      h('div', { id: 'main', style: { height: 'auto', overflow: 'visible' } }));
    G.LABEL_VARS.push(['主系統', ['料號', '客料號', '短文', '採購單號']]);
    if (!G.NL_PULL()) render();
  };
})(window);

</script>
<script>
/* ---- m_labels.js ---- */
/* m_labels.js — 標籤設計與列印（取代 NiceLabel）：貨品標籤、包裝標籤、出貨箱標；
   條碼 Code128／EAN-13／Code39、QR Code；變數 {欄位}、流水號、列印時輸入的值；一列多張；佳博 GP-1324D／GP-3120TU */
(function (G) {
  'use strict';

  // ===== 印表機 =====
  const PRINTERS = {
    gp1324d: { name: '佳博 GP-1324D（4 吋，可印寬度 104mm）', maxW: 104, dpi: 203 },
    gp3120tu: { name: '佳博 GP-3120TU（3 吋，可印寬度 80mm）', maxW: 80, dpi: 203 },
    other: { name: '其他印表機（一般雷射／噴墨）', maxW: 0, dpi: 0 }

  const SIZES = [[40, 30], [50, 30], [50, 40], [60, 40], [70, 50], [80, 50], [80, 60], [100, 50], [100, 70], [100, 100], [100, 150]];
  const FONTS = ['微軟正黑體', '新細明體', '細明體', '標楷體', 'Arial', 'Arial Black'];
  const FONT_CSS = { '新細明體': '"PMingLiU","新細明體",serif', '細明體': '"MingLiU","細明體","PMingLiU",serif', '標楷體': '"DFKai-SB","BiauKai","標楷體",serif', '微軟正黑體': '"Microsoft JhengHei","微軟正黑體",sans-serif' };
  const fontCss = n => (FONT_CSS[n] || ('"' + n + '","Microsoft JhengHei",sans-serif')).replace(/"/g, "'"); // 放在 style="…" 裡，不能有雙引號
  const SYMS = [['code128', 'Code 128（英數字，最常用）'], ['ean13', 'EAN-13（13 位商品條碼）'], ['code39', 'Code 39（大寫英數字）']];

    ['單據', ['單號', '單據名稱', '交易日期', '交貨日期', '客戶編號', '客戶名稱', '客戶全名', '送貨地址', '聯絡人', '聯絡電話', '數量', '單價', '金額', '附註說明', '合計數量', '箱號']],
    ['公司', ['公司名稱', '公司簡稱', '公司電話', '公司傳真', '公司地址', '公司統編']],
    ['系統', ['今天', '民國日期', '列印時間', '流水號', '張次', '總張數']]

  const fmtDate = v => { const s = U.d10(v); return s ? s.replace(/-/g, '/') : ''; };
  function valOf(rec, k) {
    let fmt = '';
    const c = k.indexOf(':');
    if (c > 0 && !k.startsWith('輸入:')) { fmt = k.slice(c + 1); k = k.slice(0, c); }
    const v = rec[k];

      if (/^#,?0(\.0+)?$/.test(fmt)) { const d = (fmt.split('.')[1] || '').length; return v.toLocaleString('en-US', { useGrouping: fmt.includes(','), minimumFractionDigits: d, maximumFractionDigits: d }); }

  const askVars = tpl => U.uniq(tpl.items.flatMap(it => [it.text, it.data].filter(Boolean).flatMap(s => [...String(s).matchAll(/\{輸入:([^{}]+)\}/g)].map(m => m[1].trim()))));

  // ===== 資料 =====
  function coRec() {

    return { 公司名稱: c.公司名稱, 公司簡稱: c.公司簡稱 || c.公司名稱, 公司電話: c.電話, 公司傳真: c.傳真, 公司地址: c.地址, 公司統編: c.統一編號 };
  }
  function goodsRec(code) {
    const g = S.idx.goods.get(U.trim(code)) || { 貨品編號: code };

  // ===== 排版 =====
  let mctx = null;
  function textWidthMm(text, font, sizePt) {
    if (!mctx) mctx = document.createElement('canvas').getContext('2d');
    mctx.font = (font.bold ? 'bold ' : '') + sizePt + 'pt ' + fontCss(font.name);
    return mctx.measureText(text).width * 25.4 / 96;
  }
  // 內容（不含外框定位），w/h 已依旋轉交換
  function innerHtml(it, rec, w, h, dpi) {
    try {
      if (it.t === 'barcode') { const d = fill(it.data, rec); return d ? BC.svg1d(it.sym || 'code128', d, w, h, { showText: it.showText, fontSize: it.fontSize || 7, dpi }) : ''; }
      if (it.t === 'qr') { const d = fill(it.data, rec); if (!d) return ''; const s = Math.min(w, h); return `<div style="display:flex;width:${w}mm;height:${h}mm;align-items:center;justify-content:center">${BC.svgQR(d, s, it.ecl || 'M', dpi)}</div>`; }
      if (it.t === 'image') return it.src ? `<img src="${it.src}" style="width:${w}mm;height:${h}mm;object-fit:contain;display:block">` : '';
    } catch (e) { return `<div style="color:#c00;font-size:7pt;line-height:1.1">${U.esc(e.message)}</div>`; }
    const f = it.font || { name: '微軟正黑體', size: 10 };
    const text = fill(it.text, rec);
    let size = f.size || 10;
    if (it.fit && !it.wrap && text) { const tw = textWidthMm(text, f, size); if (tw > w) size = Math.max(4, Math.floor(size * w / tw * 0.97 * 10) / 10); }
    const jc = it.align === 'center' ? 'center' : it.align === 'right' ? 'flex-end' : 'flex-start';
    const st = `width:${w}mm;height:${h}mm;display:flex;align-items:${it.valign === 'top' ? 'flex-start' : it.valign === 'bottom' ? 'flex-end' : 'center'};justify-content:${jc};text-align:${it.align || 'left'};` +
      `font-family:${fontCss(f.name)};font-size:${size}pt;${f.bold ? 'font-weight:bold;' : ''}line-height:1.12;overflow:hidden;white-space:${it.wrap ? 'pre-wrap' : 'pre'};` +
      (it.invert ? 'background:#000;color:#fff;' : 'color:#000;');
    return `<div style="${st}"><span>${U.esc(text)}</span></div>`;
  }
  function itemHtml(it, rec, dpi) {
    if (it.t === 'line') {
      const wt = it.weight || 0.3, horiz = it.w >= it.h;
      return `<div style="position:absolute;left:${it.x}mm;top:${it.y}mm;width:${horiz ? it.w : wt}mm;height:${horiz ? wt : it.h}mm;background:#000"></div>`;
    }
    if (it.t === 'rect') return `<div style="position:absolute;left:${it.x}mm;top:${it.y}mm;width:${it.w}mm;height:${it.h}mm;box-sizing:border-box;border:${it.weight || 0.3}mm solid #000;${it.fill ? 'background:#000;' : ''}${it.round ? 'border-radius:1.5mm;' : ''}"></div>`;
    const rot = +it.rot || 0, side = rot === 90 || rot === 270;
    const iw = side ? it.h : it.w, ih = side ? it.w : it.h;
    const inner = innerHtml(it, rec, iw, ih, dpi);
    const tr = rot ? `position:absolute;left:50%;top:50%;width:${iw}mm;height:${ih}mm;transform:translate(-50%,-50%) rotate(${rot}deg)` : 'position:absolute;left:0;top:0';
    return `<div style="position:absolute;left:${it.x}mm;top:${it.y}mm;width:${it.w}mm;height:${it.h}mm;overflow:hidden"><div style="${tr}">${inner}</div></div>`;
  }
  const dpiOf = tpl => (PRINTERS[tpl.printer] || {}).dpi || 0;
  G.labelHtml = (tpl, rec) => tpl.items.map(it => itemHtml(it, rec, dpiOf(tpl))).join('');

  // labels: [rec...]（已展開張數）
  G.renderLabels = function (tpl, labels) {
    const cols = Math.max(1, +tpl.cols || 1), gap = +tpl.gapX || 0;
    const pw = cols * tpl.w + (cols - 1) * gap;
    let html = '';
    for (let i = 0; i < labels.length; i += cols) {
      let row = '';
      for (let c = 0; c < cols && i + c < labels.length; c++) {
        row += `<div class="lb" style="left:${(+tpl.ox || 0) + c * (tpl.w + gap)}mm;top:${+tpl.oy || 0}mm;width:${tpl.w}mm;height:${tpl.h}mm">${G.labelHtml(tpl, labels[i + c])}</div>`;
      }
      html += `<div class="fpage lrow" style="width:${pw}mm;height:${tpl.h}mm">${row}</div>`;
    }
    const css = `@page{size:${pw}mm ${tpl.h}mm;margin:0}
      html,body{margin:0;padding:0}
      .lrow{position:relative;overflow:hidden;page-break-after:always;break-after:page;background:#fff}
      .lrow:last-child{page-break-after:auto;break-after:auto}
      .lb{position:absolute;overflow:hidden;color:#000}
      .lb svg{display:block}
      @media screen{.lrow{margin:0 auto 10px;box-shadow:0 2px 8px rgba(0,0,0,.4)}}`;
    return { html, css };
  };

  // 展開張數、流水號、張次
  function expand(rows, seq0, ask) {
    const out = [], co = coRec(), now = new Date(), today = U.today();
    for (const r of rows) {
      const n = Math.max(0, Math.round(U.num(r.copies)));
      for (let k = 0; k < n; k++) out.push(Object.assign({}, co, r.rec, { 箱號: k + 1 }, r.boxOf ? { 總張數: n } : {}));
    }
    out.forEach((rec, i) => {
      rec.今天 = today; rec.民國日期 = (now.getFullYear() - 1911) + '/' + U.pad(now.getMonth() + 1, 2) + '/' + U.pad(now.getDate(), 2);
      rec.列印時間 = today.replace(/-/g, '/') + ' ' + now.toTimeString().slice(0, 5);
      rec.流水號 = seq0 + i; rec.張次 = i + 1;
      if (rec.總張數 == null) rec.總張數 = out.length;
      for (const k in ask) rec['輸入:' + k] = rec[k] != null && rec[k] !== '' ? rec[k] : ask[k]; // 這列本身有同名欄位（例如採購單號）就用它
    });
    return out;
  }

  // ===== 清單 =====

  function list() {

      const list = G.LABELS().slice(), ok = [], bad = [], warn = [];
      const add = t => { t.id = newId(); let nm = t.name, i = 2; while (list.some(x => x.name === nm)) nm = t.name + '（' + i++ + '）'; t.name = nm; list.push(t); ok.push(t); };
      for (const f of jfile.files) {
        try {
          if (/\.lbl$/i.test(f.name)) {
            const t = G.LBL.parse(await f.arrayBuffer(), f.name);
            if (!t.items.length) throw new Error('沒有讀到任何文字物件');
            if (t._info.damaged) warn.push(f.name + '：檔案不完整（可能沒存好或複製時損壞），只讀到 ' + t._info.objects + ' 個物件，缺的請在設計畫面補上');
            delete t._info; add(t);
          } else {
            const o = JSON.parse(await f.text()), arr = Array.isArray(o) ? o : [o];
            for (const t of arr) { if (!t.items || !t.w) throw new Error('格式不對'); add(t); }
          }
        } catch (e) { bad.push(f.name + '：' + e.message); }
      }
      jfile.value = '';
      if (ok.length) await saveLabels(list);
      if (bad.length || warn.length) await UI.alert((ok.length ? '已匯入：' + ok.map(t => t.name).join('、') + '\n\n' : '') + warn.concat(bad.length ? ['無法匯入：'].concat(bad) : []).join('\n'));

  // 元件等比例縮放（字、條碼文字依較小的比例；QR 保持正方形）

    for (const it of items) {
      it.x = r1(it.x * sx); it.y = r1(it.y * sy); it.w = r1(it.w * sx);
      it.h = it.t === 'line' && it.w >= it.h ? it.h : r1(it.h * sy);
      if (it.t === 'qr') it.w = it.h = Math.min(it.w, it.h);
      if (it.font) it.font.size = Math.max(4, Math.round(it.font.size * sf * 2) / 2);
      if (it.fontSize) it.fontSize = Math.max(4, Math.round(it.fontSize * sf * 2) / 2);
    }
  }

      total();
    }
    const total = () => { const n = U.sum(rows, r => Math.max(0, Math.round(U.num(r.copies)))); cnt.textContent = '共 ' + n + ' 張'; return n; };

    function drawAsk() {
      UI.clear(askBox);
      const ks = askVars(tpl());
      askBox.style.display = ks.length ? '' : 'none';
      if (ks.length) askBox.append(h('div', { class: 'f-sep' }, '列印時輸入'));
      for (const k of ks) {
        const i = h('input', { class: 'inp', value: ask[k] || lsGet('lbl_ask_' + k) || '' });
        i.addEventListener('input', () => { ask[k] = i.value; });
        ask[k] = i.value;
        askBox.append(h('label', { class: 'f' }, h('span', null, k), i));
      }
      const seqs = S.meta.labelSeq || {};
      seqInp.value = seqs[tpl().id] || 1;
    }
    tsel.addEventListener('change', () => { lsSet(tpl().src === 'bill' ? 'lbl_tpl_bill' : 'lbl_tpl', tsel.value); drawAsk(); });

    function addGoods(codes) { for (const c of codes) { const g = goodsRec(c); rows.push({ rec: Object.assign(g, { 數量: U.num(g.包裝數量) || 1 }), copies: 1 }); } drawRows(); }
    // 單據帶入：mode line1（每個明細 1 張）、lineQty（張數＝數量）、box（整張單 N 張，箱號 1/N）
    function addBill(b, mode, boxes) {
      const ls = G.billLines(b).filter(l => U.trim(l.貨品編號) || l.品名);
      if (mode === 'box') rows.push({ rec: Object.assign(ls[0] ? lineRec(b, ls[0]) : {}, billHead(b)), copies: Math.max(1, boxes || 1), boxOf: true });
      else for (const l of ls) { const r = lineRec(b, l); rows.push({ rec: r, copies: mode === 'lineQty' ? Math.max(1, Math.round(U.num(l.數量))) : 1 }); }
      drawRows();
    }
    async function billDlg(preset) {
      const kinds = Object.entries(C.TYPES).filter(([k, t]) => t.tbl === 'T' || t.tbl === 'P');
      const ks = h('select', { class: 'inp' }, kinds.map(([k, t]) => h('option', { value: k }, t.name)));
      ks.value = preset ? preset.單據類別 : (lsGet('lbl_bk') || '出貨');
      const no = h('input', { class: 'inp', value: preset ? preset.交易單號 : '', style: { width: '150px' } });
      const pk = h('button', { class: 'btn sm', type: 'button', onclick: async () => { const b = await pickBillDlg(ks.value); if (b) no.value = b.交易單號; } }, '🔍');
      const md = h('select', { class: 'inp' }, h('option', { value: 'line1' }, '每項明細印 1 張'), h('option', { value: 'lineQty' }, '每項明細印「數量」張（一件一張）'), h('option', { value: 'box' }, '整張單印 N 張（箱標，箱號 1/N…）'));
      md.value = tpl().src === 'bill' ? 'box' : (lsGet('lbl_bm') || 'line1');
      const bx = h('input', { class: 'inp r', value: 1, style: { width: '70px' } });
      const bxl = h('span', null, '　箱數 ', bx);
      const sync = () => { bxl.style.display = md.value === 'box' ? '' : 'none'; }; md.addEventListener('change', sync); sync();
      const ok = await UI.modal('從單據帶入', h('div', { class: 'pdlg' },
        h('fieldset', null, h('legend', null, '單據'), ks, ' 單號 ', no, pk),
        h('fieldset', null, h('legend', null, '張數'), md, bxl)), [{ label: '取消', value: null }, { label: '帶入', cls: 'pri', click: () => true }], { width: '560px' });
      if (!ok) return;
      const t = C.type(ks.value), b = S.rows(C.HEAD[t.tbl]).find(x => x.單據類別 === ks.value && x.交易單號 === U.trim(no.value));
      if (!b) return UI.toast('找不到' + t.name + ' ' + no.value, 'err');
      lsSet('lbl_bk', ks.value); if (md.value !== 'box') lsSet('lbl_bm', md.value);
      addBill(b, md.value, Math.round(U.num(bx.value)));
    }

    function build() {
      if (!rows.length) { UI.toast('還沒有要印的項目', 'err'); return null; }
      const n = total(); if (!n) { UI.toast('張數都是 0', 'err'); return null; }
      if (n > 2000 && !confirm('要印 ' + n + ' 張，確定？')) return null;
      for (const k in ask) lsSet('lbl_ask_' + k, ask[k]);
      const T = tpl(), labels = expand(rows, Math.max(0, Math.round(U.num(seqInp.value))), ask);
      return { T, labels, r: G.renderLabels(T, labels) };
    }
    async function bumpSeq(T, n) {
      const usesSeq = T.items.some(it => /\{流水號/.test((it.text || '') + (it.data || '')));
      if (!usesSeq) return;
      const m = Object.assign({}, S.meta.labelSeq || {}); m[T.id] = Math.round(U.num(seqInp.value)) + n; S.setMeta('labelSeq', m); await S.save(); seqInp.value = m[T.id];
    }

    const pg = UI.page('標籤列印',
      h('div', { class: 'toolbar' }, h('span', null, '標籤樣板 '), tsel, UI.btn('設計…', () => A.go('T00031/' + tpl().id)), UI.btn('＋ 新樣板', () => A.go('T00031'))),
      UI.toolbar(UI.btn('＋ 加貨品', async () => { const r = await UI.pick('goods'); if (r) addGoods([r.code]); }),
        G.LBL_NO_BILL ? null : UI.btn('從單據帶入…', () => billDlg()),
        UI.btn('＋ 空白列（手動輸入）', () => { rows.push({ rec: { 品名: '', 規格: '', 數量: '' }, copies: 1 }); drawRows(); const ins = tb.querySelectorAll('tr:last-child input'); if (ins[0]) ins[0].focus(); }),
        UI.btn('清空', () => { rows = []; drawRows(); }),
        h('span', { class: 'spacer' }), h('span', null, '流水號從 '), seqInp, ' ', cnt),
      askBox, grid,
      UI.toolbar(UI.btn('🔍 預覽', () => { const o = build(); if (o) G.previewHtml(o.T.name + '　' + o.labels.length + ' 張', o.r); }),
        UI.btn('🖨 列印', async () => { const o = build(); if (!o) return; UI.print(o.T.name, o.r.html, o.r.css); await bumpSeq(o.T, o.labels.length); }, 'pri')),
      h('div', { class: 'box note' },
        h('b', null, '第一次用標籤機：'), '先裝佳博（Gprinter）驅動程式（標籤機隨附光碟或佳博官網下載），到 Windows「印表機內容 › 喜好設定」把紙張大小設成跟標籤一樣（例如 40×30mm），並做一次「標籤校正」。',
        h('br'), '按「列印」後在列印視窗：印表機選佳博（Gprinter GP-1324D / GP-3120TU）、邊界選「無」、縮放選「實際大小／100%」、取消勾選「頁首及頁尾」。',
        h('br'), '印歪了：到「標籤設計 › 標籤設定」調整「向右／向下微調」。條碼會自動對齊 203dpi 的點，掃描比較準。'));

    drawAsk();
    if (pend.goods) addGoods(pend.goods);
    if (pend.rows) { for (const r of pend.rows) rows.push({ rec: r, copies: 1 }); }
    if (pend.bill) setTimeout(() => billDlg(pend.bill), 30);
    drawRows();
    return pg;
  });
})(window);

</script>
<script>NL_START();</script>
</body></html>
