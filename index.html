<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>螺絲查價系統</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: sticky header with three tabs (查價 / 報價單 / 牌價管理); one centered working column, rows stack on phones. */
:root {
  --bg: #F1F2F0;
  --surface: #FFFFFF;
  --sunken: #E8EAE7;
  --ink: #1B2025;
  --muted: #5B6670;
  --line: #D6DAD8;
  --steel: #34495A;
  --top-ink: #FFFFFF;
  --zinc: #E9B512;          /* 鍍黃鋅 */
  --zinc-ink: #7A5700;
  --zinc-soft: #FBF1CC;
  --ok: #2E7D4F;
  --danger: #B3261E;
  --danger-soft: #FBE3E1;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121618; --surface: #1B2023; --sunken: #23292D; --ink: #E6E9EA; --muted: #9BA5AC;
    --line: #2F363B; --steel: #2A3A46; --top-ink: #E6E9EA; --zinc: #E9B512; --zinc-ink: #F2C94C; --zinc-soft: #3A3215;
    --ok: #6CC793; --danger: #F2847C; --danger-soft: #3D2120; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121618; --surface: #1B2023; --sunken: #23292D; --ink: #E6E9EA; --muted: #9BA5AC;
  --line: #2F363B; --steel: #2A3A46; --top-ink: #E6E9EA; --zinc: #E9B512; --zinc-ink: #F2C94C; --zinc-soft: #3A3215;
  --ok: #6CC793; --danger: #F2847C; --danger-soft: #3D2120; color-scheme: dark;
}
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-body); -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--steel); }
.num, input.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--zinc); outline-offset: 2px; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--steel); color: var(--top-ink); }
.top-inner { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 0; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .04em; }
.brand .bolt { display: inline-block; width: 12px; height: 12px; border-radius: 2px; background: var(--zinc); transform: rotate(45deg); margin-right: 4px; }
.brand small { opacity: .75; font-size: 12px; }
.tabs { display: flex; gap: 2px; margin-top: 8px; }
.tab { appearance: none; border: 0; background: transparent; color: inherit; opacity: .72; padding: 8px 14px 10px; cursor: pointer; border-bottom: 3px solid transparent; font-weight: 500; }
.tab[aria-selected="true"] { opacity: 1; border-bottom-color: var(--zinc); }
.badge { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px; border-radius: 10px; background: var(--zinc); color: #1B2025; font: 600 12px/20px var(--font-num); text-align: center; }

main { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 48px; display: grid; gap: 16px; }
section.view { display: grid; gap: 16px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.panel h2 { margin: 0; font-size: 16px; text-wrap: balance; }
.panel h3 { margin: 0; font-size: 14px; color: var(--muted); font-weight: 500; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grow { flex: 1 1 200px; min-width: 0; }
label.fld { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
input[type=text], input[type=number], input[type=search], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-width: 0; width: 100%;
}
textarea { min-height: 110px; font-family: var(--font-num); font-size: 13px; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--zinc); border-color: var(--zinc); color: #1B2025; }
.btn.primary:hover { filter: brightness(.95); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.danger { color: var(--danger); }
.btn.arm { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.sm { padding: 4px 10px; font-size: 13px; }

/* search */
.searchbar { display: flex; gap: 8px; }
.searchbar input { font-size: 16px; padding: 12px 14px; }
.filters { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)) auto; gap: 8px; align-items: end; }
.flt { display: grid; gap: 3px; min-width: 0; }
.flt span { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.flt select { appearance: none; -webkit-appearance: none; cursor: pointer; font-weight: 500; padding: 10px 30px 10px 12px; border-radius: 8px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: right 14px center, right 9px center; background-size: 5px 5px; background-repeat: no-repeat; text-overflow: ellipsis; }
.flt select.on { border-color: var(--zinc); background-color: var(--zinc-soft); }
.flt select:disabled { opacity: .5; cursor: default; }
#fReset { padding: 10px 12px; }
@media (max-width: 760px) { .filters { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 480px) { .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.results { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.res-head, .res { display: grid; grid-template-columns: minmax(0, 1fr) 90px 72px 100px 96px; gap: 12px; align-items: center; padding: 10px 14px; }
.res-head { font-size: 12px; color: var(--muted); letter-spacing: .06em; background: var(--sunken); }
.res-head span:nth-child(n+2), .res .r { text-align: right; }
.res + .res { border-top: 1px solid var(--line); }
.res .nm { font-weight: 500; overflow-wrap: anywhere; }
.res .spec { font-family: var(--font-num); font-weight: 600; margin-left: 6px; }
.res .meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.res .list { color: var(--muted); }
.disc { display: inline-block; font: 600 12px/1.6 var(--font-num); color: var(--zinc-ink); background: var(--zinc-soft); padding: 0 6px; border-radius: 4px; }
.disc.own { outline: 1px dashed var(--zinc-ink); }
.src { display: inline-block; font-size: 11px; line-height: 1.7; padding: 0 6px; border-radius: 4px; border: 1px solid var(--steel); color: var(--steel); white-space: nowrap; }
.net { font-size: 17px; font-weight: 600; }
.add { display: flex; gap: 4px; justify-content: flex-end; }
.add input { width: 52px; padding: 5px 4px; text-align: center; font-family: var(--font-num); }
.lbl { display: none; font-size: 11px; color: var(--muted); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.more { padding: 10px 14px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); text-align: center; }
@media (max-width: 680px) {
  .res-head { display: none; }
  .res { grid-template-columns: 1fr 1fr 1fr; gap: 6px 10px; }
  .res .main { grid-column: 1 / -1; }
  .res .r { text-align: left; }
  .lbl { display: block; }
  .res .add { grid-column: 1 / -1; justify-content: stretch; }
  .res .add input { width: 72px; }
  .res .add .btn { flex: 1; }
}

.sample { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; background: var(--zinc-soft); border: 1px solid var(--zinc); color: var(--ink); border-radius: var(--r); padding: 10px 14px; font-size: 14px; }

/* quote */
.qtable { width: 100%; border-collapse: collapse; font-size: 14px; }
.qwrap { overflow-x: auto; }
.qtable th { font-weight: 500; color: var(--muted); font-size: 12px; text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.qtable td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.qtable .r { text-align: right; white-space: nowrap; }
.qtable td:first-child { min-width: 170px; }
.qtable input { width: 72px; padding: 4px 6px; text-align: right; font-family: var(--font-num); }
.totals { display: grid; gap: 4px; justify-items: end; font-size: 14px; }
.totals div { display: flex; gap: 16px; }
.totals .grand { font-size: 20px; font-weight: 700; }
.totals .grand .num { color: var(--zinc-ink); }

/* manage */
.cats { display: grid; gap: 8px; }
.cat { display: grid; grid-template-columns: minmax(0, 1fr) 150px auto auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.cat:last-child { border-bottom: 0; }
.cat .eff { font-size: 12px; color: var(--muted); }
.cat .cnt { font-size: 12px; color: var(--muted); white-space: nowrap; }
@media (max-width: 560px) { .cat { grid-template-columns: 1fr 1fr; } }
.preview { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
.preview table { border-collapse: collapse; font-size: 13px; min-width: 100%; }
.preview th, .preview td { padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; text-align: left; }
.preview th select { width: auto; padding: 3px 6px; font-size: 12px; }
.preview tr.hdr td { color: var(--muted); font-style: italic; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { appearance: none; border: 0; background: var(--surface); padding: 7px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--steel); color: var(--top-ink); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }
details > summary { cursor: pointer; font-weight: 500; }
.itable { width: 100%; border-collapse: collapse; font-size: 13px; }
.itable td, .itable th { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.itable th { color: var(--muted); font-weight: 500; }
@media (prefers-reduced-motion: no-preference) { .btn, .tab { transition: background-color .12s, border-color .12s, opacity .12s; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand"><h1><span class="bolt"></span>螺絲查價</h1><small id="stamp"></small></div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="search" aria-selected="true" id="tab-search">查價</button>
      <button class="tab" role="tab" data-tab="quote" aria-selected="false" id="tab-quote">報價單<span class="badge" id="qcount" hidden>0</span></button>
      <button class="tab" role="tab" data-tab="manage" aria-selected="false" id="tab-manage">牌價管理</button>
    </nav>
  </div>
</header>

<main>
  <!-- 查價 -->
  <section class="view" id="view-search">
    <div class="sample" id="sampleBar" hidden>
      <span class="grow">目前顯示的是<b>範例資料</b>。到「牌價管理」匯入你的牌價表後即可替換。</span>
      <button class="btn sm" id="clearSample">清除範例資料</button>
    </div>
    <div class="filters" id="filters">
      <label class="flt"><span>材質</span><select id="f-material"></select></label>
      <label class="flt"><span>電鍍</span><select id="f-finish"></select></label>
      <label class="flt"><span>螺絲類別</span><select id="f-cat"></select></label>
      <label class="flt"><span>頭型</span><select id="f-head"></select></label>
      <label class="flt"><span>牙系</span><select id="f-thread"></select></label>
      <label class="flt"><span>長度</span><select id="f-length"></select></label>
      <button class="btn" id="fReset" hidden>清除篩選</button>
    </div>
    <div class="searchbar">
      <input type="search" id="q" placeholder="輸入品名、規格或品號，例如 M4x20、304 六角" autocomplete="off">
    </div>
    <div class="results" id="results"></div>
  </section>

  <!-- 報價單 -->
  <section class="view" id="view-quote" hidden>
    <div class="panel">
      <div class="row"><h2 class="grow">報價單</h2>
        <button class="btn" id="copyQuote">複製報價文字</button>
        <button class="btn danger" id="clearQuote" data-armable>清空</button>
      </div>
      <div class="row">
        <label class="fld" style="flex:1 1 200px">客戶 / 案名<input type="text" id="qCustomer" placeholder="選填"></label>
        <label class="fld" style="flex:0 1 160px">整單再折（選填）<input type="text" id="qExtra" class="num" placeholder="例如 95"></label>
        <label class="fld" style="flex:0 1 auto">營業稅<select id="qTax"><option value="0">未稅</option><option value="1">加 5% 稅</option></select></label>
      </div>
      <div class="qwrap"><table class="qtable" id="qtable"></table></div>
      <div class="totals" id="totals"></div>
      <textarea id="quoteText" readonly hidden></textarea>
    </div>
  </section>

  <!-- 牌價管理 -->
  <section class="view" id="view-manage" hidden>
    <div class="panel">
      <h2>大類別與折扣</h2>
      <p class="hint">折扣可寫成 <span class="num">65</span>、<span class="num">6.5</span> 或 <span class="num">0.65</span>（都代表 65 折）。多段折扣用空格隔開，例如 <span class="num">65 95</span> 代表 65 折再 95 折。</p>
      <div class="cats" id="cats"></div>
      <div class="row">
        <input type="text" id="newCatName" class="grow" placeholder="新類別名稱，例如：六角螺栓">
        <input type="text" id="newCatDisc" class="num" style="flex:0 1 110px" placeholder="折扣 65">
        <button class="btn primary" id="addCat">新增類別</button>
      </div>
    </div>

    <div class="panel" id="importPanel">
      <h2>匯入牌價表</h2>
      <p class="hint">可上傳 Excel (.xlsx / .xls) 或 CSV，也可以從 Excel 直接複製貼上。</p>
      <div class="row">
        <label class="fld grow">匯入到類別<select id="impCat"></select></label>
        <label class="fld" style="flex:0 1 auto">表格格式
          <span class="seg" id="impMode"><button type="button" data-mode="list" aria-pressed="true">清單</button><button type="button" data-mode="matrix" aria-pressed="false">尺寸矩陣</button></span>
        </label>
        <label class="fld" style="flex:0 1 auto">既有資料
          <select id="impReplace"><option value="replace">取代此類別的品項</option><option value="append">附加在後面</option></select>
        </label>
      </div>
      <p class="hint" id="modeHint"></p>
      <div class="row" id="matrixOpts" hidden>
        <label class="fld grow">品名（套用到整張矩陣）<input type="text" id="mxName" placeholder="例如：盤頭十字機械螺絲"></label>
        <label class="fld" style="flex:0 1 160px">材質（選填）<input type="text" id="mxMat" placeholder="例如：SUS304"></label>
        <label class="fld" style="flex:0 1 120px">單位（選填）<input type="text" id="mxUnit" placeholder="例如：支"></label>
      </div>
      <div class="row">
        <input type="file" id="impFile" accept=".xlsx,.xls,.csv,.txt" class="grow">
        <select id="impSheet" hidden style="flex:0 1 200px"></select>
      </div>
      <textarea id="impPaste" placeholder="或直接把 Excel 的儲存格複製後貼在這裡"></textarea>
      <div id="impPreview" hidden class="panel" style="padding:0;border:0;gap:8px">
        <h3 id="impSummary"></h3>
        <div class="preview" id="impTable"></div>
        <div class="row"><span class="grow hint" id="impWarn"></span><button class="btn" id="impCancel">取消</button><button class="btn primary" id="impGo">確認匯入</button></div>
      </div>
    </div>

    <div class="panel">
      <h2>單筆新增</h2>
      <div class="row">
        <label class="fld" style="flex:1 1 140px">類別<select id="oneCat"></select></label>
        <label class="fld" style="flex:1 1 120px">品號<input type="text" id="oneCode"></label>
        <label class="fld" style="flex:2 1 180px">品名<input type="text" id="oneName"></label>
        <label class="fld" style="flex:1 1 120px">規格<input type="text" id="oneSpec" placeholder="M4×20"></label>
        <label class="fld" style="flex:1 1 100px">材質<input type="text" id="oneMat" placeholder="鐵、SUS304"></label>
        <label class="fld" style="flex:1 1 100px">電鍍<input type="text" id="oneFin" placeholder="五彩、鍍鋅"></label>
        <label class="fld" style="flex:1 1 100px">頭型<input type="text" id="oneHead" placeholder="自動判斷"></label>
        <label class="fld" style="flex:1 1 100px">牙系<input type="text" id="oneThread" placeholder="自動判斷"></label>
        <label class="fld" style="flex:0 1 90px">長度<input type="text" id="oneLen" placeholder="自動判斷"></label>
        <label class="fld" style="flex:0 1 80px">單位<input type="text" id="oneUnit"></label>
        <label class="fld" style="flex:0 1 110px">牌價<input type="text" id="onePrice" class="num"></label>
        <label class="fld" style="flex:0 1 110px">個別折扣<input type="text" id="oneDisc" class="num" placeholder="同類別"></label>
      </div>
      <div class="row"><span class="grow"></span><button class="btn primary" id="addOne">加入</button></div>
    </div>

    <div class="panel">
      <details id="itemBrowser">
        <summary>檢視 / 刪除品項</summary>
        <div style="display:grid;gap:10px;margin-top:12px">
          <div class="row"><select id="brCat" style="flex:0 1 220px"></select><input type="search" id="brQ" class="grow" placeholder="篩選"></div>
          <div class="preview" id="brTable"></div>
        </div>
      </details>
    </div>

    <div class="panel">
      <h2>設定與備份</h2>
      <div class="row">
        <label class="fld" style="flex:0 1 180px">淨價小數位<select id="setDec"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
      </div>
      <p class="hint">資料只存在這台裝置的瀏覽器裡。換電腦或清除瀏覽資料前，請先備份。</p>
      <div class="row">
        <button class="btn" id="bkDownload">下載備份檔</button>
        <button class="btn" id="bkCopy">複製備份內容</button>
        <label class="btn" for="bkFile" style="display:inline-block">從備份檔還原</label>
        <input type="file" id="bkFile" accept=".json,application/json" hidden>
        <button class="btn" id="reloadBuiltin" data-armable>重新載入久允牌價表</button>
        <button class="btn danger" id="wipeAll" data-armable>刪除全部資料</button>
      </div>
      <textarea id="bkText" placeholder="也可以把備份內容貼在這裡，再按「從文字還原」" style="min-height:70px"></textarea>
      <div class="row"><span class="grow"></span><button class="btn" id="bkRestoreText">從文字還原</button></div>
    </div>
  </section>
</main>

<script>
(() => {
'use strict';
const KEY = 'screwPricing.v1';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- 內建牌價表（data/build_jiuyun.py 產生） ---------- */
function builtinData() {
  try { const d = JSON.parse(document.getElementById('builtin-data').textContent.replace(/\/\*(BUILTIN|END)\*\//g, '')); return { categories: d.categories, items: d.items, settings: d.settings || { decimals: 2 }, quote: [], source: d.source }; }
  catch (e) { return { categories: [], items: [], settings: { decimals: 2 }, quote: [] }; }
}

/* ---------- 狀態與儲存 ---------- */
let S;
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { S = JSON.parse(raw); } } catch (e) {}
  // 沒有資料，或只剩舊版範例資料時，改用內建牌價表
  if (!S || !Array.isArray(S.categories) || (S.items.length && S.items.every(i => i.ex))) S = builtinData();
  S.settings = Object.assign({ decimals: 2 }, S.settings || {});
  S.quote = S.quote || []; S.items = S.items || [];
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} const st = document.getElementById('stamp'); if (st) st.textContent = `${S.categories.length} 類 · ${S.items.length} 項`; }

/* ---------- 折扣與價格 ---------- */
// "65" / "6.5" / "0.65" / "65折" / "65 95" (多段) → 0.65 / 0.6175
function parseDisc(s) {
  if (s == null) return null;
  const str = String(s).trim();
  if (!str) return null;
  const parts = str.replace(/折|%/g, ' ').split(/[\s×xX*,+、\/]+/).filter(Boolean);
  if (!parts.length) return null;
  let f = 1;
  for (const p of parts) {
    const n = parseFloat(p);
    if (!isFinite(n) || n <= 0) return NaN;
    if (n <= 1) f *= n; else if (n <= 10) f *= n / 10; else if (n <= 100) f *= n / 100; else return NaN;
  }
  return f;
}
function fmtDisc(f) {
  if (f == null || isNaN(f)) return '—';
  if (Math.abs(f - 1) < 1e-9) return '原價';
  const v = +(f * 100).toFixed(2);
  return (Number.isInteger(v) && v % 10 === 0 ? v / 10 : v) + '折';
}
const catById = id => S.categories.find(c => c.id === id);
function itemFactor(it) {
  const own = parseDisc(it.disc);
  if (own != null && !isNaN(own)) return { f: own, own: true };
  const c = catById(it.cat); const f = c ? parseDisc(c.discount) : null;
  return { f: f == null || isNaN(f) ? 1 : f, own: false };
}
const round = (n, d = S.settings.decimals) => { const p = Math.pow(10, d); return Math.round((n + Number.EPSILON) * p) / p; };
const fmt = (n, d = S.settings.decimals) => isFinite(n) ? n.toLocaleString('zh-TW', { minimumFractionDigits: d, maximumFractionDigits: d }) : '—';
const fmtList = n => isFinite(n) ? n.toLocaleString('zh-TW', { maximumFractionDigits: 4 }) : '—';
function netPrice(it) { return round(it.price * itemFactor(it).f); }
function parsePrice(v) {
  if (typeof v === 'number') return v;
  const n = parseFloat(String(v ?? '').replace(/[,\s$＄元NT]/gi, ''));
  return isFinite(n) ? n : NaN;
}

/* ---------- 搜尋 ---------- */
function norm(s) {
  return String(s ?? '').replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/　/g, ' ').toLowerCase().replace(/\s*[x×*]\s*/g, '×');
}
function searchText(it) { return norm([it.code, it.name, it.spec, it.material, it.finish, it.head, it.thread, it.sup, noteOf(it), catById(it.cat)?.name].join(' ')); }

/* ---------- UI 共用 ---------- */
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }
// 兩段式確認（不使用 confirm()）
function armed(btn, label, fn) {
  if (btn.dataset.armed) { delete btn.dataset.armed; btn.classList.remove('arm'); btn.textContent = btn.dataset.orig; fn(); return; }
  btn.dataset.orig = btn.textContent; btn.dataset.armed = '1'; btn.classList.add('arm'); btn.textContent = label;
  setTimeout(() => { if (btn.dataset.armed) { delete btn.dataset.armed; btn.classList.remove('arm'); btn.textContent = btn.dataset.orig; } }, 3500);
}
async function copyText(text, fallbackEl) {
  try { await navigator.clipboard.writeText(text); toast('已複製'); }
  catch (e) { if (fallbackEl) { fallbackEl.hidden = false; fallbackEl.value = text; fallbackEl.select(); toast('請按 Ctrl+C / 長按複製'); } }
}

/* ---------- 分頁 ---------- */
let tab = 'search';
function setTab(t) {
  tab = t;
  $$('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
  ['search', 'quote', 'manage'].forEach(v => $('#view-' + v).hidden = v !== t);
  render();
}
$$('.tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));

/* ---------- 規格屬性（沒填時從品名、規格自動判斷） ---------- */
const HEADS = ['內六角', '六角', '半圓頭', '圓頭', '盤頭', '大扁頭', '扁頭', '平頭', '沉頭', '丸頭', '蝶頭', '華司頭', '喇叭頭', '截頭', '無頭', '圓柱頭', '方頭'];
function specParts(spec) {
  const p = String(spec || '').replace(/\s+/g, '').split(/[×xX*]/).filter(Boolean);
  return { dia: p[0] || '', pitch: p.length >= 3 ? p[1] : '', len: p.length >= 2 ? p[p.length - 1] : '' };
}
// 備註：品項自己的備註；久允內建資料一律標「久允牌價」
const SUP_NOTE = { '久允': '久允牌價 115/06/26' };
// 單位是「100支」這種整包時，數量以份計
const qtyText = (q, unit) => unit && /^\d/.test(unit) ? `${q} 份（每份 ${unit}）` : `${q}${unit || ''}`;
function noteOf(it) { return (it.note || SUP_NOTE[it.sup] || '').trim(); }
const FINISH_RE = /五彩|彩鋅|白鋅|黑鋅|藍白鋅|鍍鋅|鍍鎳|鍍鉻|鍍銅|鍍黃|染黑|發黑|黑色|電鍍|白皮|達克羅|熱浸鋅|磷酸皮膜/;
function attr(it, key) {
  if (key === 'cat') return it.cat;
  if (key === 'material' || key === 'finish') {
    // 舊資料材質欄可能寫成「鐵五彩」，自動拆成材質與電鍍
    const m = (it.material || '').trim();
    if (it.finish != null && it.finish !== '') return key === 'finish' ? String(it.finish).trim() : m;
    const hit = m.match(FINISH_RE);
    if (key === 'finish') return hit ? hit[0] : '';
    return hit ? (m.replace(hit[0], '').trim() || m) : m;
  }
  if (it[key]) return String(it[key]).trim();
  const sp = specParts(it.spec);
  if (key === 'length') return sp.len.replace(/mm$/i, '');
  if (key === 'head') return HEADS.find(h => (it.name || '').includes(h)) || '';
  if (key === 'thread') {
    const d = sp.dia, n = it.name || '';
    if (/自攻|鑽尾|木螺絲/.test(n) || /^(#|ST)/i.test(d)) return '自攻牙';
    if (/UNC/i.test(d + n)) return 'UNC 英制粗牙';
    if (/UNF/i.test(d + n)) return 'UNF 英制細牙';
    if (/^M\d/i.test(d)) return sp.pitch || /細牙/.test(n) ? '公制細牙' : '公制粗牙';
    if (/["\/]/.test(d)) return '英制';
    return '';
  }
  return '';
}
// 長度排序：英吋換成 mm 再比
function lenValue(v) {
  const s = String(v).replace(/mm|L/gi, '');
  const inch = /["\/]/.test(s);
  const m = s.replace(/"/g, '').match(/^(?:(\d+)-)?(\d+(?:\.\d+)?)(?:\/(\d+))?$/);
  if (!m) return Infinity;
  let n = m[3] ? +m[2] / +m[3] : +m[2]; if (m[1]) n += +m[1];
  return inch ? n * 25.4 : n;
}
const FACETS = [
  ['material', '材質'], ['finish', '電鍍'], ['cat', '螺絲類別'], ['head', '頭型'], ['thread', '牙系'], ['length', '長度'],
];
const flt = { material: '', finish: '', cat: '', head: '', thread: '', length: '' };
// 電鍍沒寫的品項歸在「未標示」，方便篩出來
const facetVal = (it, k) => attr(it, k) || (k === 'finish' ? '未標示' : '');
function matchFacets(it, skip) { return FACETS.every(([k]) => k === skip || !flt[k] || facetVal(it, k) === flt[k]); }

/* ---------- 查價頁 ---------- */
const LIMIT = 200;
function renderFilters(base) {
  if (flt.cat && !catById(flt.cat)) flt.cat = '';
  for (const [k, label] of FACETS) {

function parseDelimited(text) {
  const delim = text.includes('\t') ? '\t' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"' && cell === '') q = true;
    else if (ch === delim) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
function cleanRows(rows) {
  return rows.map(r => r.map(c => (c == null ? '' : String(c)).trim())).filter(r => r.some(c => c !== ''));
}

function convertRows() {
  const items = []; let skipped = 0;
  if (!imp.rows) return { items, skipped };
  if (imp.mode === 'list') {
    const start = imp.hasHeader ? 1 : 0;
    for (const r of imp.rows.slice(start)) {
      const o = {}; imp.map.forEach((k, i) => { if (k) o[k] = r[i] ?? ''; });
      const price = parsePrice(o.price);
      if (!isFinite(price) || !(o.name || o.spec || o.code)) { skipped++; continue; }
      items.push({ code: o.code || '', name: o.name || '', spec: o.spec || '', material: o.material || '', finish: o.finish || '', head: o.head || '', thread: o.thread || '', length: o.length || '', unit: o.unit || '', price, disc: o.disc || '', note: o.note || '', catName: o.cat || '' });
    }
  } else {
    const hdr = imp.rows[0]; const name = $('#mxName').value.trim() || (catById($('#impCat').value)?.name ?? '');
    for (const r of imp.rows.slice(1)) {
      const len = r[0]; if (!len) { skipped++; continue; }
      for (let c = 1; c < r.length; c++) {
        const price = parsePrice(r[c]); const dia = hdr[c];
        if (!dia || !isFinite(price) || r[c] === '') continue;
        const L = /^\d/.test(len) || !/^\d/.test(dia) ? `${dia}×${len}` : `${len}×${dia}`;
        items.push({ code: '', name, spec: L.replace(/\s+/g, ''), material: $('#mxMat').value.trim(), unit: $('#mxUnit').value.trim(), price, disc: '' });
      }
    }
  }
  return { items, skipped };
}
function resetImport() { imp = { mode: imp.mode, rows: null, map: [], wb: null }; $('#impPaste').value = ''; $('#impFile').value = ''; $('#impSheet').hidden = true; buildPreview(); }
$('#impCancel').addEventListener('click', resetImport);
$('#impGo').addEventListener('click', () => {
  const { items } = convertRows(); const target = $('#impCat').value; const replace = $('#impReplace').value === 'replace';
  const byFile = target === '__file'; const touched = new Set();
  const resolveCat = it => {
    if (!byFile) return target;
    const nm = (it.catName || '未分類').trim(); let c = S.categories.find(x => x.name === nm);
    if (!c) c = addCategory(nm, ''); return c.id;
  };
  const prepared = items.map(it => { const cat = resolveCat(it); touched.add(cat); const { catName, ...rest } = it; return { id: uid(), cat, ...rest }; });
  if (replace) S.items = S.items.filter(i => !touched.has(i.cat));
  S.items.push(...prepared); save();
  const names = [...touched].map(id => catById(id)?.name).join('、');
  resetImport(); renderManage(); toast(`已匯入 ${prepared.length} 項到「${names}」`);
});

/* ---------- 單筆新增 ---------- */
$('#addOne').addEventListener('click', () => {
  const cat = $('#oneCat').value; const price = parsePrice($('#onePrice').value);
  if (!cat) { toast('請先新增類別'); return; }
  if (!($('#oneName').value.trim() || $('#oneSpec').value.trim())) { toast('請輸入品名或規格'); return; }
  if (!isFinite(price)) { toast('牌價要是數字'); return; }
  const d = $('#oneDisc').value.trim(); if (d && isNaN(parseDisc(d))) { toast('個別折扣格式錯誤'); return; }
  S.items.push({ id: uid(), cat, code: $('#oneCode').value.trim(), name: $('#oneName').value.trim(), spec: $('#oneSpec').value.trim(), material: $('#oneMat').value.trim(), finish: $('#oneFin').value.trim(), head: $('#oneHead').value.trim(), thread: $('#oneThread').value.trim(), length: $('#oneLen').value.trim(), unit: $('#oneUnit').value.trim(), price, disc: d });
  save();
  ['oneCode', 'oneSpec', 'onePrice', 'oneLen'].forEach(id => $('#' + id).value = ''); renderManage(); toast('已加入');
});

/* ---------- 品項瀏覽 ---------- */
function renderBrowser() {
  if (!$('#itemBrowser').open) return;
  const c = $('#brCat').value || 'all'; const terms = norm($('#brQ').value).split(/\s+/).filter(Boolean);
  let list = S.items.filter(i => c === 'all' || i.cat === c);
  if (terms.length) list = list.filter(it => { const t = searchText(it); return terms.every(w => t.includes(w)); });
  $('#brTable').innerHTML = list.length ? `<table class="itable"><thead><tr><th>類別</th><th>品號</th><th>品名</th><th>規格</th><th>材質</th><th>電鍍</th><th>頭型</th><th>牙系</th><th>長度</th><th>單位</th><th>牌價</th><th>個別折扣</th><th>備註</th><th></th></tr></thead><tbody>` +
    list.slice(0, 300).map(it => `<tr><td>${esc(catById(it.cat)?.name)}</td><td class="num">${esc(it.code)}</td><td>${esc(it.name)}</td><td class="num">${esc(it.spec)}</td><td>${esc(attr(it, 'material'))}</td><td>${esc(attr(it, 'finish'))}</td><td>${esc(attr(it, 'head'))}</td><td>${esc(attr(it, 'thread'))}</td><td class="num">${esc(attr(it, 'length'))}</td><td>${esc(it.unit)}</td><td class="num">${fmtList(it.price)}</td><td><input type="text" class="num" style="width:80px;padding:3px 6px" value="${esc(it.disc)}" data-idisc="${it.id}" id="id-${it.id}" placeholder="—"></td><td>${esc(noteOf(it))}</td><td><button class="btn ghost sm danger" data-idel="${it.id}">刪除</button></td></tr>`).join('') +
    `</tbody></table>${list.length > 300 ? `<div class="more">只顯示前 300 筆（共 ${list.length}）</div>` : ''}` : `<div class="empty">沒有品項</div>`;
}
$('#itemBrowser').addEventListener('toggle', renderBrowser);
$('#brCat').addEventListener('change', renderBrowser); $('#brQ').addEventListener('input', renderBrowser);
$('#brTable').addEventListener('click', e => { const b = e.target.closest('[data-idel]'); if (b) { S.items = S.items.filter(i => i.id !== b.dataset.idel); save(); renderManage(); } });
$('#brTable').addEventListener('change', e => {
  const id = e.target.dataset.idisc; if (!id) return; const v = e.target.value.trim();
  if (v && isNaN(parseDisc(v))) { toast('折扣格式錯誤'); return; }
  S.items.find(i => i.id === id).disc = v; save(); toast(v ? `已設為 ${fmtDisc(parseDisc(v))}` : '改回類別折扣');
});

/* ---------- 設定與備份 ---------- */
$('#setDec').addEventListener('change', e => { S.settings.decimals = +e.target.value; save(); toast('已更新小數位'); });
const backup = () => JSON.stringify({ app: 'screw-pricing', version: 1, exported: new Date().toISOString(), categories: S.categories, items: S.items, settings: S.settings }, null, 1);
$('#bkDownload').addEventListener('click', () => {
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([backup()], { type: 'application/json' }));
    const d = new Date(); a.download = `螺絲牌價備份-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.json`;
    document.body.appendChild(a); a.click(); a.remove(); toast('如果沒有開始下載，請改用「複製備份內容」');
  } catch (e) { toast('無法下載，請改用「複製備份內容」'); }
});
$('#bkCopy').addEventListener('click', () => copyText(backup(), $('#bkText')));
function restore(text) {
  try {
    const d = JSON.parse(text); if (!Array.isArray(d.categories) || !Array.isArray(d.items)) throw new Error('格式不符');
    S = { categories: d.categories, items: d.items, settings: Object.assign({ decimals: 2 }, d.settings), quote: [] }; save(); render(); toast(`已還原 ${d.categories.length} 類、${d.items.length} 項`);
  } catch (e) { toast('還原失敗：內容不是有效的備份'); }
}
$('#bkFile').addEventListener('change', async e => { const f = e.target.files[0]; if (f) restore(await f.text()); e.target.value = ''; });
$('#bkRestoreText').addEventListener('click', () => { const t = $('#bkText').value.trim(); if (t) restore(t); else toast('請先貼上備份內容'); });
$('#reloadBuiltin').addEventListener('click', e => armed(e.currentTarget, '確定重新載入？', () => {
  const b = builtinData(); const ids = new Set(b.categories.map(c => c.id));
  S.categories = S.categories.filter(c => !ids.has(c.id)).concat(b.categories);
  S.items = S.items.filter(i => i.sup !== '久允' && !ids.has(i.cat)).concat(b.items);
  save(); render(); toast(`已載入久允牌價表 ${b.items.length} 項`);
}));
$('#wipeAll').addEventListener('click', e => armed(e.currentTarget, '確定全部刪除？', () => { S = { categories: [], items: [], settings: S.settings, quote: [] }; FACETS.forEach(([k]) => flt[k] = ''); save(); render(); toast('已刪除全部資料'); }));

/* ---------- 啟動 ---------- */
function render() {
  $('#stamp').textContent = `${S.categories.length} 類 · ${S.items.length} 項`;
  renderBadge();
  if (tab === 'search') renderSearch(); else if (tab === 'quote') renderQuote(); else renderManage();
}
load();
if (S.qmeta) { $('#qCustomer').value = S.qmeta.c || ''; $('#qExtra').value = S.qmeta.x || ''; $('#qTax').value = S.qmeta.t || '0'; }
setMode('list');
render();
})();
</script>
</body>
</html>
