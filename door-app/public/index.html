<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>開門</title>
<meta name="theme-color" content="#1f6feb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="開門">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>開門</h1>
  <button id="refresh" class="icon-btn" aria-label="重新整理" hidden>⟳</button>
</header>

<main>
  <section id="login" hidden>
    <p class="hint">請輸入 App 密碼</p>
    <form id="login-form">
      <input id="password" type="password" autocomplete="current-password" placeholder="密碼" required>
      <button type="submit" class="primary">登入</button>
    </form>
    <p id="login-error" class="error"></p>
  </section>

  <section id="home" hidden>
    <div id="demo-banner" class="banner" hidden>展示模式：使用假資料，不會真的控制門</div>
    <div id="link-ewelink" class="banner" hidden>
      易微聯尚未連結 <a class="primary small" href="/oauth/ewelink/start">連結易微聯</a>
    </div>
    <div id="errors"></div>
    <div id="devices" class="grid"><p class="hint">載入中…</p></div>
    <button id="logout" class="link">登出</button>
  </section>
</main>

<dialog id="confirm">
  <p id="confirm-text"></p>
  <div class="row">
    <button id="confirm-no">取消</button>
    <button id="confirm-yes" class="primary">確定</button>
  </div>
</dialog>

<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
