name = "door-app"
main = "src/worker.js"
compatibility_date = "2025-06-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/oauth/*"]

# 存 eWeLink 登入憑證、Tuya token 快取、登入失敗次數
# 第一次部署前執行：npx wrangler kv namespace create DOOR_KV
# 再把輸出的 id 貼到下面
[[kv_namespaces]]
binding = "DOOR_KV"
id = "REPLACE_WITH_KV_ID"

[vars]
# Tuya 資料中心，見 README
TUYA_ENDPOINT = "https://openapi.tuyaus.com"
# eWeLink 區域：台灣帳號用 as
EWELINK_REGION = "as"
