<style>
/* 版面：上方狀態列，中間是可捲動鏡頭的地圖，下方是隊伍與方向鍵；戰鬥與選單是全螢幕面板。刻意只用一種深色調。 */
:root {
  --ink-0: #0c1613; --ink-1: #12201c; --ink-2: #1a2d27; --line: #2b463e;
  --gold: #e4b64a; --gold-hi: #ffe08a; --jade: #5fc9a0; --text: #eef3ea; --muted: #9cb3a9; --red: #ff6b5b; --mp: #6fa8ff;

  --f-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: radial-gradient(70% 35% at 85% 0%, rgba(228,182,74,.12), transparent 70%), var(--ink-0); color: var(--text); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
#app { max-width: 560px; margin: 0 auto; padding-block: 8px 16px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 8px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); font-size: 13px; }
h2 { font-family: var(--f-display); font-weight: 900; margin: 0; font-size: 20px; color: var(--gold-hi); }
h3 { font-family: var(--f-display); font-weight: 700; margin: 0; font-size: 16px; color: var(--gold-hi); }
.btn { border: 1.5px solid var(--gold); border-radius: 10px; padding: 6px 12px; min-height: 42px; background: linear-gradient(180deg, #2a4a40, #1c332c); color: var(--gold-hi); font-family: var(--f-display); font-weight: 700; font-size: 15px; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 3px 0 #08100d; }
.btn small { font-family: var(--f-body); font-weight: 500; font-size: 11px; color: var(--text); opacity: .85; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #08100d; }
.btn:disabled { filter: grayscale(.8) brightness(.55); cursor: not-allowed; }
.btn.gold { background: linear-gradient(180deg, #f2cb62, #be8e2a); color: #2a1a05; border-color: var(--gold-hi); box-shadow: 0 3px 0 #6b4c10; }
.btn.gold small { color: #3a2508; }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--text); box-shadow: none; font-family: var(--f-body); font-weight: 500; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 6px; font-size: 12px; padding: 3px 8px; color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 0; min-width: 0; }
.panel { background: linear-gradient(180deg, var(--ink-2), var(--ink-1)); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }

/* ---------- 頂端 ---------- */
.top { display: flex; align-items: center; gap: 8px; }
.top .title { font-family: var(--f-display); font-weight: 900; color: var(--gold-hi); font-size: 18px; letter-spacing: .06em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.res { display: flex; gap: 10px; align-items: center; font-size: 13px; flex-wrap: wrap; justify-content: flex-end; }
.silver { font-weight: 700; color: var(--gold-hi); display: flex; gap: 4px; align-items: center; }
.ingot { width: 16px; height: 11px; border-radius: 3px 3px 6px 6px; background: linear-gradient(180deg, #f5f1e6, #a9a59a); box-shadow: inset 0 -2px 0 #77736a; display: inline-block; }
.mat { display: inline-flex; gap: 2px; align-items: center; }
.mat b { font-family: var(--f-display); font-size: 11px; width: 17px; height: 17px; display: inline-grid; place-items: center; border-radius: 4px; background: #2c3a34; }

/* ---------- 地圖 ---------- */
.where { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.where b { font-family: var(--f-display); color: var(--gold-hi); font-size: 16px; }
.viewport { position: relative; width: 100%; aspect-ratio: 11 / 9; overflow: hidden; border-radius: 12px; border: 1px solid var(--line); background: #0a1410; touch-action: manipulation; }
.world { position: absolute; left: 0; top: 0; transition: transform .14s linear; }
.tile { position: absolute; width: var(--t); height: var(--t); }
.t-g { background: #3d6b3a; }
.t-tg { background: repeating-linear-gradient(115deg, #2f5a2c 0 4px, #376833 4px 7px); }
.t-p { background: #a98a5a; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
.t-tree { background: #3d6b3a; }
.t-tree::after { content: ""; position: absolute; inset: 10%; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #4f8a46, #1f4220); box-shadow: 0 3px 0 rgba(0,0,0,.35); }
.t-w { background: repeating-linear-gradient(0deg, #2a6aa8 0 5px, #3479bb 5px 9px); }
.t-rock { background: linear-gradient(160deg, #6b6155, #3f372f); box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
.feat { position: absolute; inset: 8%; border-radius: 8px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 900; font-size: calc(var(--t) * .48); color: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.4); }
.f-shrine { background: linear-gradient(180deg, #c43a24, #7d1a10); border: 2px solid var(--gold); color: var(--gold-hi); }
.f-forge { background: linear-gradient(180deg, #ff8a3d, #a8401a); border: 2px solid #ffd08a; }
.f-chest { inset: 18%; background: linear-gradient(180deg, #b8862e, #6e4a12); border: 2px solid var(--gold-hi); border-radius: 5px; }
.f-chest.open { filter: grayscale(.8) brightness(.6); }
.f-boss { inset: 4%; border-radius: 50%; background: radial-gradient(circle at 40% 30%, #5e2a16, #22100a); border: 2px solid var(--gold); overflow: hidden; color: var(--gold-hi); animation: pulse 1.6s ease-in-out infinite; }
.f-boss img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.7); }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(228,182,74,.35), 0 3px 0 rgba(0,0,0,.4); } }
.hero-token { position: absolute; width: var(--t); height: var(--t); transition: transform .14s linear; z-index: 3; }
.hero-token span { position: absolute; inset: 6%; border-radius: 50%; overflow: hidden; border: 2px solid var(--gold-hi); background: #6b4a22; box-shadow: 0 3px 4px rgba(0,0,0,.5); }
.hero-token img { width: 100%; height: 100%; object-fit: cover; transform-origin: 56% 40%; transform: scale(1.5); }
.flash { position: absolute; inset: 0; z-index: 5; pointer-events: none; animation: flash .5s steps(4) both; background: #fff; }
@keyframes flash { 0%,50% { opacity: .8 } 25%,75% { opacity: 0 } 100% { opacity: 0 } }

.party-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.mini { display: grid; grid-template-columns: 34px 1fr; gap: 6px; align-items: center; padding: 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--ink-1); min-width: 0; text-align: left; }
.mini .nm { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 6px; border-radius: 3px; background: #07100d; overflow: hidden; margin-top: 2px; }
.bar i { display: block; height: 100%; background: var(--red); transition: width .3s; }
.bar.mp i { background: var(--mp); }

.controls { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
.menu-btns { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.menu-btns .btn { min-height: 40px; font-size: 14px; }
.dpad { display: grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 46px); gap: 3px; }
.dpad button { border-radius: 10px; border: 1px solid var(--line); background: var(--ink-2); color: var(--gold-hi); font-size: 18px; }
.dpad button:active { background: #23382f; }
.ctx { display: flex; gap: 6px; flex-wrap: wrap; }
.ctx .btn { flex: 1 1 30%; }

/* ---------- 頭像 ---------- */
.ava { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; font-family: var(--f-display); font-weight: 900; font-size: 16px; border: 2px solid var(--gold); flex: none; position: relative; }
.ava img { width: 100%; height: 100%; object-fit: cover; }
.ava.wukong { background: #6b4a22; } .ava.bajie { background: #6b3a4a; color: #ffd6e0; } .ava.wujing { background: #2f4a6b; color: #d6e8ff; }
.ava.big { width: 52px; height: 52px; font-size: 24px; }
.ava.dead { filter: grayscale(1) brightness(.5); }

/* ---------- 戰鬥 ---------- */
.overlay { position: fixed; inset: 0; z-index: 20; background: var(--ink-0); overflow-y: auto; }
.overlay .in { max-width: 560px; margin: 0 auto; padding-block: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px)); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); display: grid; gap: 10px; }
.battle-bg { background: radial-gradient(90% 60% at 50% 20%, rgba(196,58,36,.18), transparent 70%), var(--ink-0); }
.foes { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: 8px; align-items: end; min-height: 170px; }
.foe { position: relative; display: grid; gap: 4px; justify-items: center; text-align: center; padding: 8px 4px; border-radius: 12px; border: 1.5px solid transparent; background: none; min-width: 0; }
.foe.targetable { border-color: var(--gold); background: rgba(228,182,74,.08); animation: blink 1s ease-in-out infinite; }
@keyframes blink { 50% { background: rgba(228,182,74,.18); } }
.foe.dead { opacity: .25; }
.foe .seal { width: 76px; height: 76px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; font-family: var(--f-display); font-weight: 900; font-size: 32px; background: radial-gradient(circle at 40% 30%, #4c2238, #200d18); color: #ffb3c7; border: 2.5px solid #a94a6d; position: relative; }
.foe.boss .seal { width: 108px; height: 108px; border-color: var(--gold); color: var(--gold-hi); }
.foe .seal img { width: 100%; height: 100%; object-fit: cover; }
.foe .nm { font-family: var(--f-display); font-weight: 700; font-size: 13px; color: var(--gold-hi); line-height: 1.2; }
.foe .bar { width: 100%; height: 8px; }
.el { display: inline-grid; place-items: center; font-family: var(--f-display); font-weight: 900; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; color: #10140f; flex: none; }
.el-metal { background: var(--el-metal); } .el-wood { background: var(--el-wood); } .el-water { background: var(--el-water); } .el-fire { background: var(--el-fire); } .el-earth { background: var(--el-earth); }
.foe .elx { position: absolute; top: 6px; right: 10%; }
.msg { min-height: 44px; padding: 8px 12px; border-radius: 10px; background: var(--ink-1); border: 1px solid var(--line); font-size: 14px; }
.heroes { display: grid; gap: 6px; }
.hcard { display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--ink-1); text-align: left; width: 100%; position: relative; }
.hcard.active { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(228,182,74,.25); }
.hcard.targetable { border-color: var(--jade); animation: blink2 1s ease-in-out infinite; }
@keyframes blink2 { 50% { background: rgba(95,201,160,.12); } }
.hcard .top2 { display: flex; justify-content: space-between; gap: 6px; font-size: 13px; }
.hcard .top2 b { font-family: var(--f-display); color: var(--gold-hi); font-size: 15px; }
.hcard .bar { height: 8px; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
.tag { font-size: 11px; border-radius: 4px; padding: 0 5px; background: #23382f; color: var(--jade); }
.tag.bad { background: #3a2323; color: var(--red); }
.actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.actions .btn { min-height: 48px; }
.sublist { display: grid; gap: 6px; }
.sublist button { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; text-align: left; border: 1px solid var(--line); border-radius: 10px; background: var(--ink-1); padding: 8px 10px; }
.sublist button:disabled { opacity: .45; cursor: not-allowed; }
.sublist b { font-family: var(--f-display); color: var(--gold-hi); }
.sublist span { font-size: 12px; color: var(--muted); grid-column: 1 / -1; }
.sublist .cost { color: var(--mp); font-size: 12px; font-weight: 700; }
.elpick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.elpick button { border-radius: 10px; border: 1px solid var(--line); background: var(--ink-1); padding: 8px 2px; display: grid; justify-items: center; gap: 2px; font-size: 12px; }
.elpick .el { width: 30px; height: 30px; font-size: 15px; }
.float { position: absolute; left: 50%; top: 10%; transform: translateX(-50%); font-family: var(--f-display); font-weight: 900; font-size: 22px; pointer-events: none; animation: floatUp .9s ease-out both; white-space: nowrap; text-shadow: 0 2px 6px rgba(0,0,0,.8); z-index: 4; }
@keyframes floatUp { from { opacity: 0; transform: translate(-50%, 12px) } 20% { opacity: 1 } to { opacity: 0; transform: translate(-50%, -26px) } }
.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-5px) } 75% { transform: translateX(5px) } }

/* ---------- 面板 ---------- */
.lines { display: grid; gap: 4px; }
.lines div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed var(--line); padding: 4px 0; font-size: 14px; }
.lines div:last-child { border: 0; }
.tabs { display: flex; gap: 6px; }
.tabs button { flex: 1; border: 1px solid var(--line); border-radius: 10px; background: var(--ink-1); padding: 6px; display: flex; gap: 6px; align-items: center; justify-content: center; font-size: 13px; }
.tabs button[aria-pressed="true"] { border-color: var(--gold); background: #23382f; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stat { background: #08120f; border: 1px solid var(--line); border-radius: 8px; padding: 5px; text-align: center; }
.stat b { display: block; font-family: var(--f-display); font-size: 16px; color: var(--gold-hi); }
.stat span { font-size: 11px; color: var(--muted); }
.eq { display: grid; gap: 6px; }
.sockets { display: flex; gap: 6px; }
.socket { width: 46px; height: 46px; border-radius: 10px; border: 1.5px dashed var(--line); background: #08120f; display: grid; place-items: center; padding: 0; overflow: hidden; }
.socket.filled { border-style: solid; border-color: var(--gold); }
.socket img, .socket svg { width: 38px; height: 38px; }
.socket.locked { opacity: .3; cursor: default; }
.gem-ico { width: 40px; height: 40px; flex: none; display: grid; place-items: center; }
.gem-ico img, .gem-ico svg { width: 100%; height: 100%; }
.gemrow { display: grid; grid-template-columns: 40px 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--ink-1); }
.gemrow .acts { display: flex; gap: 6px; }
.gemrow .btn { min-height: 34px; font-size: 12px; padding: 2px 8px; }
.stall { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stone { display: grid; gap: 4px; justify-items: center; text-align: center; padding: 8px 4px; border-radius: 12px; border: 1px solid var(--line); background: var(--ink-1); min-width: 0; font-size: 12px; }
.stone svg { width: 100%; max-width: 90px; height: auto; }
.stone .btn { width: 100%; min-height: 34px; font-size: 12px; padding: 2px 4px; }
.reveal { display: grid; justify-items: center; gap: 6px; text-align: center; }
.reveal .gem-ico { width: 110px; height: 110px; }
.cost { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; }
.cost .lack { color: var(--red); }
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; background: var(--text); color: var(--ink-0); border-radius: 8px; padding: 9px 14px; width: min(calc(100% - 32px), 440px); font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.toast b { color: #6a3a00; }
.dialog { display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: start; }
.dialog p { margin: 0; font-size: 15px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>

  // 走一步

  function tryStep(dr, dc) {
    if (busy || S.battle || !$('#panel').hidden) return false;
    const ev = step(S, dr, dc, rng);
    if (ev.boss) { walkQueue = []; bossPrompt(ev.boss); return false; }
    if (!ev.moved) { walkQueue = []; return false; }
    sfx.step(); placeCamera(false);

      if (ev.chest.silver) parts.push(`${T().reward.silver} +${ev.chest.silver}`);

  function walkTo(tr, tc) {
    // BFS 找路
    const key = (r, c) => r + ',' + c, start = S.pos, prev = {}, q = [start], seen = new Set([key(...start)]);
    while (q.length) {
      const [r, c] = q.shift();
      if (r === tr && c === tc) break;
      for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nr = r + dr, nc = c + dc, k = key(nr, nc);
        if (seen.has(k) || !canEnter(S, nr, nc)) continue;
        const ch = tileAt(nr, nc);
        if (BOSS_AT[ch] && !S.beaten.includes(BOSS_AT[ch]) && !(nr === tr && nc === tc)) continue;
        seen.add(k); prev[k] = [r, c]; q.push([nr, nc]);
      }
    }
    if (!prev[key(tr, tc)]) return;
    const path = []; let cur = [tr, tc];
    while (key(...cur) !== key(...start)) { path.unshift(cur); cur = prev[key(...cur)]; }
    walkQueue = path.map(([r, c], i) => { const [pr, pc] = i ? path[i - 1] : start; return [r - pr, c - pc]; });
    clearInterval(walkTimer);
    walkTimer = setInterval(() => { const d = walkQueue.shift(); if (!d || !tryStep(...d)) { clearInterval(walkTimer); walkQueue = []; } }, 150);
  }
  $('#viewport').addEventListener('click', (e) => { const t = e.target.closest('[data-rc]'); if (!t) return; const [r, c] = t.dataset.rc.split(',').map(Number); audio(); walkTo(r, c); });

  $('#battle').addEventListener('click', (e) => {

      let socks = '';
      for (let i = 0; i < 3; i++) { const id = e.sockets[i]; if (id != null) { const gm = gemOf(S, id); socks += `<button class="socket filled" data-unsock="${sl}:${id}" title="${gemName(gm.el, gm.g)}">${gemIcon(gm.el, gm.g)}</button>`; } else if (i < cap) socks += `<button class="socket" data-sock="${sl}">+</button>`; else socks += `<span class="socket locked" title="${T().sockLocked}"></span>`; }
      return `<div class="panel eq"><div class="row" style="justify-content:space-between"><span><span class="muted">${T().slot[sl]}</span> <b style="font-family:var(--f-display);color:var(--gold-hi)">${T().equip[sl][k][e.tier]}</b></span><span class="muted num">${sl === 'weapon' ? T().st.atk + ' +' + EQUIP.weapon[e.tier].atk : T().st.def + ' +' + EQUIP.armor[e.tier].def + '・' + T().st.hp + ' +' + EQUIP.armor[e.tier].hp}</span></div><div class="sockets">${socks}</div></div>`;
    }).join('');
    const skills = `<div class="sublist">${Object.keys(SKILLS).filter(id => SKILLS[id].hero === k).map(id => `<button disabled style="opacity:${h.lv >= SKILLS[id].lv ? 1 : .45};cursor:default"><b>${T().skills[id][0]}</b><span class="cost">${h.lv >= SKILLS[id].lv ? SKILLS[id].mp + ' MP' : T().lvReq(SKILLS[id].lv)}</span><span>${T().skills[id][1]}</span></button>`).join('')}</div>`;
    openPanel(head(T().tParty) + tabs + `<div class="row" style="align-items:center">${ava(k, true)}<div><h3>${hn(k)}</h3><span class="muted">${T().roles[k]}</span></div></div>` + stats + el + eq + `<h3>${T().skillsTitle}</h3>` + skills);
  }
  function gemsPanel() {
    const groups = [];
    for (const el of ELEMENTS) for (let g = 5; g >= 1; g--) { const all = S.gems.filter(x => x.el === el && x.g === g); if (all.length) groups.push({ el, g, all, loose: all.filter(x => !isSocketed(S, x.id)) }); }
    groups.sort((a, b) => b.g - a.g);
    openPanel(head(T().tGems) + (groups.length ? `<div style="display:grid;gap:6px">${groups.map(gr => { const canF = gr.g < 5 && gr.loose.length >= 3; return `<div class="gemrow">${gemIcon(gr.el, gr.g)}<div style="min-width:0"><b style="color:${EL_COLOR[gr.el]};font-family:var(--f-display)">${gemName(gr.el, gr.g)} ×${gr.all.length}</b><div class="muted">${T().gemFx[gr.el](GEM_STAT[gr.el][gr.g])}${gr.all.length - gr.loose.length ? '・' + T().socketed(gr.all.length - gr.loose.length) : ''}</div></div><div class="acts">${gr.g < 5 ? `<button class="btn ${canF ? 'gold' : 'ghost'}" data-fuse="${gr.el}:${gr.g}" ${canF ? '' : 'disabled'}>${T().fuse(Math.round(FUSE_RATE[gr.g] * 100))}</button>` : ''}<button class="btn ghost" data-sell="${gr.el}:${gr.g}" ${gr.loose.length ? '' : 'disabled'}>${T().sell(GEM_PRICE[gr.g])}</button></div></div>`; }).join('')}</div>` : `<p class="muted">${T().noGems}</p>`));
  }
  function itemsPanel() {
    openPanel(head(T().tItems) + `<div class="sublist">${Object.keys(ITEMS).map(it => `<button data-use="${it}" ${S.items[it] <= 0 ? 'disabled' : ''}><b>${T().items[it][0]}</b><span class="cost" style="color:var(--gold-hi)">×${S.items[it]}</span><span>${T().items[it][1]}</span></button>`).join('')}</div>`);
  }
  function usePanel(it) {
    openPanel(head(T().useOn) + `<div class="heroes">${PARTY.map(k => { const h = S.heroes[k], st = heroStats(S, k); return `<button class="hcard" data-useon="${it}:${k}">${ava(k, true, h.hp <= 0)}<div><div class="top2"><b>${hn(k)}</b><span class="num muted">${h.hp}/${st.hp}　${h.mp}/${st.mp}</span></div><div class="bar"><i style="width:${h.hp / st.hp * 100}%"></i></div><div class="bar mp"><i style="width:${h.mp / st.mp * 100}%"></i></div></div></button>`; }).join('')}</div>`);
  }
  function shopPanel() {
    openPanel(head(T().shop) + `<div class="sublist">${Object.keys(ITEMS).map(it => `<button data-buy="${it}" ${S.silver < ITEMS[it].price ? 'disabled' : ''}><b>${T().items[it][0]}</b><span class="cost" style="color:var(--gold-hi)">${T().buy(ITEMS[it].price)}</span><span>${T().items[it][1]}　${T().have(S.items[it])}</span></button>`).join('')}</div>`);
  }
  const ROCKS = ['M18 62 L22 34 L40 18 L66 16 L84 30 L90 56 L78 80 L48 86 L26 80 Z', 'M14 56 L26 28 L52 20 L76 26 L88 48 L84 72 L60 86 L32 84 Z', 'M20 70 L16 44 L34 22 L60 18 L80 30 L88 60 L72 82 L40 86 Z', 'M16 60 L28 30 L48 24 L70 20 L86 40 L84 70 L62 84 L30 82 Z'];
  function stoneSVG(st) {
    const id = 'st' + (++gid), c = EL_COLOR[st.tint];
    const sparks = [[38, 40], [62, 36], [54, 60]].slice(0, st.sheen).map(([x, y]) => `<path d="M${x} ${y - 6} L${x + 1.6} ${y - 1.6} L${x + 6} ${y} L${x + 1.6} ${y + 1.6} L${x} ${y + 6} L${x - 1.6} ${y + 1.6} L${x - 6} ${y} L${x - 1.6} ${y - 1.6} Z" fill="#fff8d0"/>`).join('');
    const win = st.peeked ? `<ellipse cx="50" cy="54" rx="14" ry="10" fill="${EL_COLOR[st.el]}" stroke="#0c1613" stroke-width="2"/>` : '';
    return `<svg viewBox="0 0 100 100"><defs><radialGradient id="${id}" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#9a958c"/><stop offset=".6" stop-color="#5b5750"/><stop offset="1" stop-color="#34312c"/></radialGradient></defs><path d="${ROCKS[st.shape]}" fill="url(#${id})" stroke="#1d1b18" stroke-width="2"/><path d="${ROCKS[st.shape]}" fill="${c}" opacity=".26"/>${win}${sparks}</svg>`;
  }
  function stallPanel() {
    const tiers = `<div class="tabs"><button data-tier="0" aria-pressed="${S.stallTier === 0}">${T().tierRough}</button><button data-tier="1" aria-pressed="${S.stallTier === 1}" ${stoneUnlocked(S, 1) ? '' : 'disabled'}>${stoneUnlocked(S, 1) ? T().tierMount : T().tierLock}</button></div>`;
    const g = T().grade;
    const stall = S.stall.length ? `<div class="stall">${S.stall.map(st => { const p = STONES[st.tier].price, pc = peekCost(st); return `<div class="stone">${stoneSVG(st)}<div class="muted" style="min-height:2.6em">${st.peeked ? `${elBadge(st.el)} ${T().range(g[st.range[0]], g[st.range[1]])}<br>${T().offer(st.offer)}` : ''}</div>${st.peeked ? `<button class="btn ghost" data-flip="${st.id}" ${S.silver < p ? 'disabled' : ''}>${T().flip(st.offer - p)}</button>` : `<button class="btn ghost" data-peek="${st.id}" ${S.silver < pc ? 'disabled' : ''}>${T().peek(pc)}</button>`}<button class="btn gold" data-cut="${st.id}" ${S.silver < p ? 'disabled' : ''}>${T().cut(p)}</button></div>`; }).join('')}</div>` : `<p class="muted">${T().empty}</p>`;
    openPanel(head(T().stall) + `<p class="muted" style="margin:0">${T().stallHelp}</p>` + tiers + stall);
  }
  function forgePanel() {
    openPanel(head(T().forge) + PARTY.map(k => `<div class="panel" style="display:grid;gap:8px"><div class="row" style="align-items:center">${ava(k)}<h3>${hn(k)}</h3></div>${['weapon', 'armor'].map(sl => { const e = S.heroes[k][sl], nx = EQUIP[sl][e.tier + 1]; return `<div style="display:grid;gap:4px"><div class="row" style="justify-content:space-between"><span class="muted">${T().slot[sl]}：<b style="color:var(--text)">${T().equip[sl][k][e.tier]}</b></span></div>${nx ? `<div class="cost">${T().need}：${costHTML(nx.cost)}</div><button class="btn ${canCraft(S, k, sl) ? 'gold' : ''}" data-craft="${k}:${sl}" ${canCraft(S, k, sl) ? '' : 'disabled'}>${T().craftTo(T().equip[sl][k][e.tier + 1])}</button>` : `<span class="muted">${T().maxed}</span>`}</div>`; }).join('')}</div>`).join(''));
  }
  function helpPanel() { openPanel(head(T().tHelp) + `<div style="display:grid;gap:8px">${T().helpText.map(p => `<p style="margin:0">${p}</p>`).join('')}</div>`); }
  let panelKind = null;
  function open(kind) { panelKind = kind; ({ party: partyPanel, gems: gemsPanel, items: itemsPanel, shop: shopPanel, stall: stallPanel, forge: forgePanel, help: helpPanel })[kind](); }
  document.addEventListener('click', (e) => {
    const o = e.target.closest('#app [data-open]');
    if (o) { if (o.dataset.hero) ui.hero = o.dataset.hero; audio(); open(o.dataset.open); return; }
    const cx = e.target.closest('[data-ctx]');
    if (cx && cx.dataset.ctx === 'rest') { if (rest(S)) { sfx.heal(); save(); renderTop(); toast(lang === 'en' ? 'Fully rested.' : '全員回滿了。'); } }
  });
  $('#panel').addEventListener('click', (e) => {
    const q = (s) => e.target.closest(s);
    if (q('[data-close]')) return closePanel();
    if (q('[data-fight-boss]')) { const k = q('[data-fight-boss]').dataset.fightBoss; $('#panel').hidden = true; return openBattle([k]); }
    if (q('[data-reset-yes]')) { S = fresh(); save(); closePanel(); buildMap(); renderTop(); return intro(); }
    if (q('[data-intro-ok]')) { return closePanel(); }
    if (q('[data-tab]')) { ui.hero = q('[data-tab]').dataset.tab; return partyPanel(); }
    if (q('[data-sock]')) {
      const sl = q('[data-sock]').dataset.sock, loose = S.gems.filter(g => !isSocketed(S, g.id)).sort((a, b) => b.g - a.g);
      panelKind = 'pick';
      return openPanel(head(T().pickGem) + (loose.length ? `<div class="sublist">${loose.map(g => `<button data-pick="${sl}:${g.id}" style="grid-template-columns:40px 1fr;align-items:center">${gemIcon(g.el, g.g)}<span style="grid-column:auto"><b style="color:${EL_COLOR[g.el]}">${gemName(g.el, g.g)}</b><br>${T().gemFx[g.el](GEM_STAT[g.el][g.g])}</span></button>`).join('')}</div>` : `<p class="muted">${T().noGems}</p>`) + `<button class="btn ghost" data-back-party>${T().back}</button>`);
    }
    if (q('[data-back-party]')) return partyPanel();
    if (q('[data-pick]')) { const [sl, id] = q('[data-pick]').dataset.pick.split(':'); socket(S, ui.hero, sl, +id); save(); return partyPanel(); }
    if (q('[data-unsock]')) { const [sl, id] = q('[data-unsock]').dataset.unsock.split(':'); unsocket(S, ui.hero, sl, +id); save(); return partyPanel(); }
    if (q('[data-fuse]')) {
      const [el, g] = q('[data-fuse]').dataset.fuse.split(':'); const r = fuse(S, el, +g, rng); save();
      if (r) { r.ok ? sfx.gem(r.gem.g) : sfx.hurt(); toast(r.ok ? `<b>${T().fuseOk}</b> ${gemName(r.gem.el, r.gem.g)}` : T().fuseFail); }
      return gemsPanel();
    }
    if (q('[data-sell]')) { const [el, g] = q('[data-sell]').dataset.sell.split(':'); const gm = looseGems(S, el, +g)[0]; if (gm) { sellGem(S, gm.id); sfx.coin(); save(); } renderTop(); return gemsPanel(); }
    if (q('[data-use]')) return usePanel(q('[data-use]').dataset.use);
    if (q('[data-useon]')) {
      const [it, k] = q('[data-useon]').dataset.useon.split(':'), h = S.heroes[k], st = heroStats(S, k), I = ITEMS[it];
      if (S.items[it] <= 0) return itemsPanel();
      if (I.revivePct) { if (h.hp > 0) return toast(lang === 'en' ? 'Not fallen.' : '他沒有倒下。'); h.hp = Math.round(st.hp * I.revivePct); }
      else { if (h.hp <= 0) return toast(lang === 'en' ? 'Revive them first.' : '要先救起來。'); if (I.heal) h.hp = Math.min(st.hp, h.hp + I.heal); if (I.mp) h.mp = Math.min(st.mp, h.mp + I.mp); }
      S.items[it]--; sfx.heal(); save(); renderTop(); return itemsPanel();
    }
    if (q('[data-buy]')) { if (buyItem(S, q('[data-buy]').dataset.buy)) { sfx.coin(); save(); renderTop(); } return shopPanel(); }
    if (q('[data-tier]')) { const t = +q('[data-tier]').dataset.tier; if (stoneUnlocked(S, t) && S.stallTier !== t) { S.stallTier = t; refreshStall(S, rng); save(); } return stallPanel(); }
    if (q('[data-peek]')) { peek(S, +q('[data-peek]').dataset.peek, rng); save(); renderTop(); return stallPanel(); }
    if (q('[data-flip]')) { const r = flipStone(S, +q('[data-flip]').dataset.flip); if (r) { sfx.coin(); toast(`${r.profit >= 0 ? '+' : ''}${r.profit}`); } save(); renderTop(); return stallPanel(); }
    if (q('[data-cut]')) {
      const r = cutStone(S, +q('[data-cut]').dataset.cut); save(); renderTop();
      if (!r) return stallPanel();
      if (r.gem) sfx.gem(r.gem.g); else noise(.3, 300, .6);
      return openPanel(head(T().stall) + `<div class="reveal">${r.gem ? `${gemIcon(r.gem.el, r.gem.g)}<h2 style="color:${EL_COLOR[r.gem.el]}">${gemName(r.gem.el, r.gem.g)}</h2><span class="muted">${T().got}　${T().gemFx[r.gem.el](GEM_STAT[r.gem.el][r.gem.g])}</span>` : `<h2 style="color:var(--muted)">${T().grade[0]}</h2><span class="muted">${T().waste}</span>`}<button class="btn gold" data-back-stall>${T().ok}</button></div>`);
    }
    if (q('[data-back-stall]')) return stallPanel();
    if (q('[data-craft]')) { const [k, sl] = q('[data-craft]').dataset.craft.split(':'); if (craft(S, k, sl)) { tone([440, 660], .5); toast(`<b>${T().equip[sl][k][S.heroes[k][sl].tier]}</b>`); save(); renderTop(); } return forgePanel(); }
  });

  function intro() {
    openPanel(`<div class="dialog"><span class="ava big" style="background:#c43a24;color:var(--gold-hi)" lang="zh-Hant">${art('npc_tudi') ? `<img src="${art('npc_tudi')}" alt="">` : '土'}</span><div style="display:grid;gap:6px">${T().intro.map(p => `<p>${p}</p>`).join('')}</div></div><button class="btn gold" data-intro-ok>${T().introBtn}</button>`);
  }

  $('#btn-lang').addEventListener('click', () => { lang = lang === 'zh' ? 'en' : 'zh'; try { localStorage.setItem('dsrpg.lang', lang); } catch (e) {} document.documentElement.lang = lang === 'en' ? 'en' : 'zh-Hant'; renderTop(); if (!$('#battle').hidden) renderBattle(); if (!$('#panel').hidden && panelKind && panelKind !== 'pick') open(panelKind); });
  $('#btn-sound').addEventListener('click', () => { soundOn = !soundOn; renderTop(); });
  $('#btn-reset').addEventListener('click', () => { panelKind = null; openPanel(`<h2>${T().resetBtn}</h2><p class="muted">${T().resetQ}</p><div class="row"><button class="btn ghost" data-close>${T().cancel}</button><button class="btn gold" data-reset-yes>${T().resetYes}</button></div>`); });
  window.addEventListener('resize', () => { if (S) buildMap(); });

  function boot(data) {
    const saved = data && data.S && data.S.heroes ? data.S : load();
    S = saved || fresh();
    S.battle = null;
    document.documentElement.lang = lang === 'en' ? 'en' : 'zh-Hant';
    buildMap(); renderTop();
    if (!saved) intro();
  }
  window.claude?.hot?.snapshot?.(() => ({ S: { ...S, battle: null } }));
  if (window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot(window.claude?.hot?.data);
})();
</script>
